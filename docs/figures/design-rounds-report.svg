                    <stop offset="0%" stop-color="#475569" stop-opacity="0.48" />
                    <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.42" />
                  </linearGradient>
                  <linearGradient id="fgR1G2" x1="0" y1="0" x2="1" y2="0">
