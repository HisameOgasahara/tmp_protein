<text x="20" y="51" fill="#cbd5e1" font-size="13">3D 백본 20개 × 백본당 서열 8개 = 서열 160개</text>
<svg x="20" y="65" width="460" height="223" viewBox="0 25 460 223" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="독자 설계 1회차 3D 백본 20개 곱하기 8서열 160개 누적 통과 160에서 126, 63, 0 및 design_04 선택">
                <defs>
