<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="800" role="img" aria-labelledby="title" font-family="system-ui, sans-serif"><title id="title">1·2회차 설계 결과</title>
<g transform="translate(0 0)"><rect width="500" height="300" rx="14" fill="#101723"/>
