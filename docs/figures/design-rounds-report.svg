                <rect x="146" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="168" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="190" y="226" width="14" height="6" rx="2" fill="#475569" />
                <rect x="212" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="234" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="256" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="278" y="226" width="14" height="6" rx="2" fill="#475569" />
                <rect x="300" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="322" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="344" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="366" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="388" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="410" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <rect x="432" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <text x="439" y="242" text-anchor="middle" font-size="8.5" fill="#64748b">20</text>
