                <text x="34" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#94a3b8">전체</text>
                <text x="166" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2dd4bf">pLDDT &gt; 80</text>
                <text x="298" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38bdf8">접힘 &lt; 1 Å</text>
                <text x="424" y="168" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fb7185">PAE &lt; 10</text>

