                <rect x="58" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
                <!-- design_04 glowing peak -->
                <rect x="78" y="203" width="18" height="30" rx="4" fill="rgba(45, 212, 191, 0.18)" />
                <rect x="80" y="206" width="14" height="26" rx="3" fill="#2dd4bf" stroke="#99f6e4" stroke-width="1" />
                <text x="87" y="242" text-anchor="middle" font-size="9" font-weight="800" fill="#2dd4bf">04</text>
                <rect x="102" y="229" width="14" height="3" rx="1.5" fill="#1e293b" />
