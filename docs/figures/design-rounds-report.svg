                <path d="M 44,58 C 100,58 100,67.8 156,67.8 L 156,140.2 C 100,140.2 100,150 44,150 Z" fill="url(#fgR1G1)" />
                <path d="M 176,67.8 C 232,67.8 232,85.9 288,85.9 L 288,122.1 C 232,122.1 232,140.2 176,140.2 Z" fill="url(#fgR1G2)" />
                <path d="M 308,85.9 C 358,85.9 372,102.5 408,102.5 L 408,105.5 C 372,105.5 358,122.1 308,122.1 Z" fill="url(#fgR1G3)" />

