        fxCanvas.width = bw; fxCanvas.height = bh;
      }
    }

    function computeCamera(t) {
      let target = CAM_GALLERY.target.slice();
      let dist = CAM_GALLERY.dist;
      let quat = CAM_GALLERY.quat.slice();
      let wideMode = false;

      if (t < 19.0) {
        // Beats 0 & 1: gallery view (gentle subtle breathing)
        wideMode = true;
        const sway = Math.sin(t * 0.45) * 0.04;
        quat = qNorm(qMul(CAM_GALLERY.quat, qAxisAngle([0, 1, 0], sway)));
      } else if (t < 23.0) {
        // Beat 2A: gallery reveal of design_04
        wideMode = true;
        const sway = Math.sin(t * 0.5) * 0.035;
        quat = qNorm(qMul(CAM_GALLERY.quat, qAxisAngle([0, 1, 0], sway)));
      } else if (t < 26.0) {
        // Beat 2B: smooth fly-in from gallery to design_04 + TrkA
        const u = easeInOutCubic(invLerp(23.0, 25.6, t));
        wideMode = u < 0.5;
        target = vLerp(CAM_GALLERY.target, CAM_D04_FOCUS.target, u);
        dist = lerp(CAM_GALLERY.dist, CAM_D04_FOCUS.dist, u);
        quat = qSlerp(CAM_GALLERY.quat, CAM_D04_FOCUS.quat, u);
      } else if (t < 33.5) {
        // Beat 3: Backbone Reuse (design_04 locked left-center)
        const u = easeInOutCubic(invLerp(26.0, 27.6, t));
        target = vLerp(CAM_D04_FOCUS.target, CAM_REUSE.target, u);
        dist = lerp(CAM_D04_FOCUS.dist, CAM_REUSE.dist, u);
        quat = qSlerp(CAM_D04_FOCUS.quat, CAM_REUSE.quat, u);
      } else if (t < 43.0) {
        // Beat 4: Round 2 Light Gates (design_04 anchored neatly on far-left!)
        const u = easeInOutCubic(invLerp(33.5, 34.7, t));
        target = vLerp(CAM_REUSE.target, CAM_R2_ANCHOR.target, u);
        dist = lerp(CAM_REUSE.dist, CAM_R2_ANCHOR.dist, u);
        quat = qSlerp(CAM_REUSE.quat, CAM_R2_ANCHOR.quat, u);
      } else {
        // Beat 5: Grand Finale r22 x TrkA 3D Complex!
        const u = easeInOutCubic(invLerp(43.0, 45.2, t));
        target = vLerp(CAM_R2_ANCHOR.target, CAM_FINAL.target, u);
        dist = lerp(CAM_R2_ANCHOR.dist, CAM_FINAL.dist, u);
        const orbitAng = smoothstep(45.2, 48.0, t) * 0.22 + (state.t >= T_TOTAL - 0.01 && !state.userOrbitQuat ? state.orbitClock * 0.24 : 0);
        const qFinal = qNorm(qMul(CAM_FINAL.quat, qAxisAngle([0, 1, 0], orbitAng)));
        quat = qSlerp(CAM_R2_ANCHOR.quat, qFinal, u);
      }

      // Apply user manual orbit/zoom overlay if user dragged in 3D scenes
      if (state.userOrbitQuat && t >= 25.0) {
        quat = state.userOrbitQuat.slice();
      }
      if (t >= 25.0) {
        dist = clamp(dist * state.userZoomFactor, 26, 360);
      }

      return { target, dist, quat, wideMode };
    }

    // Track 3D projected positions of backbones & design_04 Cα atoms each frame
    const bbScreen = new Array(20);
    let d04ScreenPts = [];
    let d04CenterScreen = { sx: 200, sy: 300 };

    function renderFrame(t) {
      resizeCanvases();
      const W = state.cssW, H = state.cssH, dpr = state.dpr;
      const L1 = getGateLayout(W, H, false);
      const L2 = getGateLayout(W, H, true);
      const L = (t >= 33.5) ? L2 : L1;

      // Clear hover visibility flags
      for (let i = 0; i < R1.length; i++) { R1[i].visible = false; R1[i].isDroppedVis = false; R1[i].activeCol = -1; }
      for (let i = 0; i < R2.length; i++) { R2[i].visible = false; R2[i].isDroppedVis = false; R2[i].activeCol = -1; }

      // --- A. WEBGL 3D PASS ---
      gl.enable(gl.DEPTH_TEST);
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const aspect = W / Math.max(1, H);
      const cam = computeCamera(t);
      const { view, eye, effDist, right, up, back } = makeViewAndEye(cam, aspect, cam.wideMode);
      const light1 = vNorm(vAdd(vAdd(vScale(right, 0.42), vScale(up, 0.60)), vScale(back, 0.68)));
      const light2 = vNorm(vAdd(vAdd(vScale(right, -0.58), vScale(up, -0.30)), vScale(back, 0.56)));

      gl.uniform3fv(LOC.uCamPos, eye);
      gl.uniform3fv(LOC.uLight1, light1);
      gl.uniform3fv(LOC.uLight2, light2);
      gl.uniform1f(LOC.uFogStart, effDist + 35);
      gl.uniform1f(LOC.uFogEnd, effDist + 165);

      const proj = makePerspective(FOV, aspect, 1.0, 900);
      const vpMat = mat4Mul(proj, view);
      gl.uniformMatrix4fv(LOC.uViewProj, false, vpMat);
      state.lastVpMat = vpMat;

      // Compute visibility & transforms of the 20 backbones
      const galleryAlpha =
        t < 7.0 ? 1.0 :
        t < 8.6 ? 1.0 - smoothstep(7.0, 8.6, t) :
        t < 19.0 ? 0.0 :
        t < 20.6 ? smoothstep(19.0, 20.6, t) :
        t < 23.0 ? 1.0 :
        t < 25.0 ? 1.0 - smoothstep(23.0, 25.0, t) : 0.0;

      // design_04 continuous visibility & world position across the entire film!
      const d04GridToComplex = easeInOutCubic(invLerp(23.0, 25.4, t));
      const d04Pos = t < 23.0 ? D04.gridPos : vLerp(D04.gridPos, DES_CENTROID, d04GridToComplex);

      const d04Alpha =
        t < 7.0 ? 1.0 :
        t < 8.6 ? 1.0 - smoothstep(7.0, 8.6, t) :
        t < 19.0 ? 0.0 :
        t < 20.6 ? smoothstep(19.0, 20.6, t) :
        t < 43.2 ? 1.0 :
        t < 44.6 ? 1.0 - smoothstep(43.2, 44.6, t) : 0.0;

      // Gentle 3D rotation for gallery backbones & anchored design_04
      const d04Quat =
        t < 23.0 ? qAxisAngle([0, 1, 0], Math.sin(t * 0.7 + 0.9) * 0.25) :
        t < 25.4 ? qSlerp(qAxisAngle([0, 1, 0], Math.sin(23.0 * 0.7 + 0.9) * 0.25), Q_ID, d04GridToComplex) :
        t < 33.5 ? Q_ID : // ROCK-SOLID LOCKED during Backbone Reuse!
        t < 43.0 ? qAxisAngle([0, 1, 0], (t - 33.5) * 0.42) :
        qSlerp(qAxisAngle([0, 1, 0], (43.0 - 33.5) * 0.42), Q_ID, smoothstep(43.0, 44.4, t));

      // Scan wave in Beat 0
      const scanWave = (t >= 2.5 && t <= 6.2) ? lerp(-1.5, 20.8, invLerp(2.5, 6.2, t)) : -99;
      // Reveal spotlight in Beat 2
      const clueReveal = smoothstep(21.0, 22.6, t);

      // 1a. Draw other 19 backbones
      for (const b of BACKBONES) {
        const bloomU = easeOutBack(invLerp(b.idx * 0.085, b.idx * 0.085 + 0.75, t));
        const sc = t < 2.6 ? Math.max(0.01, bloomU) : (t >= 23.0 ? lerp(1.0, 0.55, smoothstep(23.0, 25.0, t)) : 1.0);
        const zPush = t >= 23.0 ? -55 * smoothstep(23.0, 25.0, t) : 0;
        const bPos = b.chosen ? d04Pos : [b.gridPos[0], b.gridPos[1], zPush];
        const bQuat = b.chosen ? d04Quat : qAxisAngle([0, 1, 0], Math.sin(t * 0.6 + b.idx * 0.7) * 0.28);

        // Save 2D projected center for orb anchoring
        bbScreen[b.idx] = projectPoint(vpMat, bPos, W, H) || { sx: W * 0.5, sy: H * 0.5 };

        if (b.chosen) {
          d04CenterScreen = bbScreen[b.idx];
          if (d04Alpha > 0.01) {
            let tintCol = COL.slate, tintMix = 0.0, em = 0.06;
            if (t < 21.0) {
              // Uniform cool slate during Round 1 (no spoilers!)
              tintCol = COL.slate; tintMix = 0.90; em = 0.04;
              const dw = Math.abs(b.idx - scanWave);
              if (dw < 1.8) {
                const p = 1 - dw / 1.8;
                tintCol = COL.sky; tintMix = 0.60; em = 0.16 * p;
              }
            } else if (t < 23.0) {
              // Radiant teal-amber reveal!
              tintMix = 0.90 * (1 - clueReveal);
              em = 0.06 + 0.16 * clueReveal;
            } else if (t >= 26.0 && t < 33.5) {
              // Locked scaffold glow during reuse
              const lockGlow = 0.08 + 0.06 * Math.sin((t - 26.0) * 3.5);
              em = lockGlow;
            } else if (t >= 33.5 && t < 43.0) {
              em = 0.11;
            }
            const d04Scale = t < 2.6 ? sc : (t >= 33.5 && t < 43.0 ? lerp(1.0, 0.78, smoothstep(33.5, 34.7, t)) : 1.0);
            drawAuto(b.mesh, d04Alpha, d04Pos, d04Scale, d04Quat, em, tintCol, tintMix);
          }
        } else if (galleryAlpha > 0.01) {
          let tintCol = COL.slate, tintMix = 0.0, em = 0.02;
          const dw = Math.abs(b.idx - scanWave);
          if (dw < 1.8) {
            const p = 1 - dw / 1.8;
            tintCol = COL.sky; tintMix = 0.42 * p; em = 0.14 * p;
          } else if (t >= 21.0) {
            // Dim non-chosen backbones during clue reveal
            const dimAmt = b.near > 0 ? 0.35 * clueReveal : 0.78 * clueReveal;
            tintCol = COL.dimSlate; tintMix = dimAmt; em = -0.04 * dimAmt;
          }
          drawAuto(b.mesh, galleryAlpha, bPos, sc, bQuat, em, tintCol, tintMix);
        }
      }

      // Project design_04 Cα atoms during Beat 3 for residue-level sequence weaving!
      d04ScreenPts = [];
      if (t >= 25.5 && t <= 33.8) {
        for (let i = 0; i < D04.ca.length; i++) {
          const wp = vAdd(d04Pos, qRot(d04Quat, D04.ca[i]));
          const pr = projectPoint(vpMat, wp, W, H);
          d04ScreenPts.push(pr);
        }
      }

      // 1b. TrkA Target (appears in Beat 2B context, dims in Beat 3, full glory in Beat 5!)
      const targetAlpha =
        t < 23.6 ? 0.0 :
        t < 25.2 ? smoothstep(23.6, 25.2, t) * 0.92 :
        t < 27.0 ? lerp(0.92, 0.20, smoothstep(25.8, 27.0, t)) :
        t < 33.0 ? 0.20 :
        t < 34.2 ? 0.20 * (1 - smoothstep(33.0, 34.2, t)) :
        t < 43.2 ? 0.0 :
        smoothstep(43.2, 44.8, t);

      if (targetAlpha > 0.01) {
        drawAuto(COMPLEX.target, targetAlpha, ZERO3, 1.0, Q_ID, 0.0);
        drawAuto(COMPLEX.hotMarkers, targetAlpha, ZERO3, 1.0, Q_ID, 0.16);
      }

      // 1c. Beat 2B: Brief shimmer of the 8 real Round-1 docked poses of design_04!
      const r1GhostAlpha =
        (t >= 24.4 && t <= 27.2)
          ? smoothstep(24.4, 25.1, t) * (1 - smoothstep(26.2, 27.2, t))
          : 0.0;
      if (r1GhostAlpha > 0.01) {
        for (const g of R1_D04_MESHES) {
          drawTranslucent(g.mesh, r1GhostAlpha * (g.near ? 0.34 : 0.26), ZERO3, 1.0, Q_ID, g.near ? 0.08 : 0.12);
        }
      }

      // 1d. Beat 3: Mutated residue 3D beads sparkling along locked design_04 backbone!
      if (t >= 28.0 && t <= 33.2) {
        const waveProg = invLerp(28.0, 32.6, t);
        const curIdx = Math.min(49, Math.floor(waveProg * 50));
        const curSeq = R2[curIdx];
        if (curSeq && curSeq.muts) {
          const beadAlpha = smoothstep(28.0, 28.4, t) * (1 - smoothstep(32.7, 33.2, t));
          if (beadAlpha > 0.05) {
            for (const ri of curSeq.muts) {
              const p = vAdd(d04Pos, D04.ca[ri]);
              drawAuto(COMPLEX.unitSphere, beadAlpha, p, 0.68, Q_ID, 0.28, COL.emerald, 1.0);
            }
          }
        }
      }

      // 1e. Beat 5: Final r22 Binder + Sidechains + Optional Violet Backbone Overlay
      const r22Alpha = smoothstep(43.2, 44.8, t);
      if (r22Alpha > 0.01) {
        drawAuto(COMPLEX.binder, r22Alpha, ZERO3, 1.0, Q_ID, 0.02);
        const scAlpha = smoothstep(44.2, 45.6, t);
        if (scAlpha > 0.01) {
          drawAuto(COMPLEX.scHot, scAlpha, ZERO3, 1.0, Q_ID, 0.06);
          drawAuto(COMPLEX.scBind, scAlpha, ZERO3, 1.0, Q_ID, 0.04);
          drawAuto(COMPLEX.termMarkers, scAlpha, ZERO3, 1.0, Q_ID, 0.14);
        }
        // Auto brief violet backbone proof pulse (45.0 -> 47.4s) OR manual toggle
        const autoOverlay = (t >= 44.9 && t <= 47.5)
          ? smoothstep(44.9, 45.6, t) * (1 - smoothstep(46.8, 47.5, t)) * 0.65
          : 0.0;
        const overlayAlpha = state.showDesignOverlay ? 0.66 : autoOverlay;
        if (overlayAlpha > 0.01) {
          drawTranslucent(COMPLEX.designOverlay, overlayAlpha, ZERO3, 1.0, Q_ID, 0.14);
        }
      }

      // =======================================================================
      // --- B. SYNCHRONIZED 2D MANIM VECTOR & MOTION LAYER ---
      // =======================================================================
      fx.save();
      fx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fx.clearRect(0, 0, W, H);

      // Subtle Manim grid during both filter beats
      const gridAlpha =
        (t >= 7.2 && t <= 19.2) ? smoothstep(7.2, 8.5, t) * (1 - smoothstep(18.4, 19.2, t)) :
        (t >= 33.6 && t <= 43.4) ? smoothstep(33.6, 34.6, t) * (1 - smoothstep(42.5, 43.4, t)) : 0.0;
      drawSubtleGrid(W, H, gridAlpha);

      // -----------------------------------------------------------------------
      // BEAT 0 (0.0 -> 7.0s): 20 Backbones spawn 8 actual AA sequences each = 160
      // -----------------------------------------------------------------------
      if (t < 7.0) {
        const { cellW, cellH } = getGalleryCellSize(W, H);
        const fsz0 = clamp(cellW * 0.052, 7.2, 9.2);
        const charW0 = getMonoCharW(fsz0, 700);
        const maxTokenW0 = Math.max(28, cellW * 0.30);
        const chars0 = clamp(Math.floor((maxTokenW0 - 8) / charW0), 5, 8);
        let spawnedCount = 0;
        let lastSpawned = null;

        for (const c of R1) {
          const bb = bbScreen[c.bb];
          const tBirth = 2.5 + (c.bb / 20) * 2.8 + c.si * 0.05;
          const u = invLerp(tBirth, tBirth + 0.55, t);
          if (u <= 0) continue;
          spawnedCount++;
          lastSpawned = c;

          const e = easeOutBack(u);
          const off = getBackboneSeqOffset(c.si, cellW, cellH, 0, W, H);
          const ox = bb.sx + off.dx * e;
          const oy = bb.sy + off.dy * e;

          // Delicate filament linking each amino-acid sequence to its parent 3D backbone
          fx.save();
          fx.strokeStyle = `rgba(86, 204, 242, ${(0.22 * Math.min(1, u)).toFixed(3)})`;
          fx.lineWidth = 0.85;
          fx.beginPath();
          fx.moveTo(bb.sx, bb.sy);
          fx.lineTo(ox - off.side * (chars0 * charW0 * 0.45), oy);
          fx.stroke();
          fx.restore();

          const isHov = (state.hoverCand === c);
          const box = drawSeqToken(ox, oy, c.seq, {
            chars: chars0,
            ellipsis: false,
            fontSize: fsz0,
            weight: 700,
            color: isHov ? "#ffffff" : SEQ_TEXT_COL,
            alpha: Math.min(0.95, u * 1.25),
            bgAlpha: 0.68,
            borderColor: "rgba(86, 204, 242, 0.40)",
            scale: Math.min(1.0, Math.max(0.2, e)),
            isHovered: isHov
          });
          c.hitX = ox; c.hitY = oy; c.hitHW = box.hw; c.hitHH = box.hh; c.visible = true;
        }

        // Clean top-right live equation counter — colors matched to 3D backbones & actual sequence text!
        const bbShown = Math.min(20, Math.floor(invLerp(0.0, 2.2, t) * 20.99));
        fx.save();
        fx.shadowColor = "rgba(7, 11, 18, 0.92)";
        fx.shadowBlur = 10;
        const eqFont = "800 22px 'Pretendard Variable', Pretendard, sans-serif";
        if (t < 2.5) {
          drawSegmentedText(W - 32, 26, [
            { text: `뼈대 ${bbShown}개`, color: BB_TEXT_COL }
          ], eqFont, "right");
          fx.textAlign = "right";
          fx.textBaseline = "top";
          fx.font = "600 12px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(163, 180, 200, 0.85)";
          fx.fillText("3D 단백질 뼈대", W - 32, 55);
        } else {
          drawSegmentedText(W - 32, 26, [
            { text: "뼈대 20개", color: BB_TEXT_COL },
            { text: " × ", color: "#64748b" },
            { text: "서열 8개", color: SEQ_TEXT_COL },
            { text: ` = ${spawnedCount}`, color: "#f1f5f9" }
          ], eqFont, "right");
          fx.textAlign = "right";
          fx.textBaseline = "top";
          fx.font = "600 12px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(148, 163, 184, 0.85)";
          fx.fillText("1회차 아미노산 서열 후보", W - 32, 55);
          if (lastSpawned && lastSpawned.seq && W >= 1040 && H >= 660) {
            const sampleN = clamp(Math.floor((W * 0.22) / 6.2), 16, 30);
            fx.font = `600 10px ${MONO_FONT_FAM}`;
            fx.fillStyle = "rgba(86, 204, 242, 0.72)";
            fx.fillText(`${lastSpawned.id}  ${lastSpawned.seq.slice(0, sampleN)}…`, W - 32, 74);
          }
        }
        fx.restore();
      }

      // -----------------------------------------------------------------------
      // BEAT 1 (7.0 -> 19.0s): Round 1 True Score-Axis 3-Filter Stage (160 -> 126 -> 63 -> 0)
      // -----------------------------------------------------------------------
      if (t >= 7.0 && t < 19.0) {
        const { cellW, cellH } = getGalleryCellSize(W, H);
        const detachU = easeInOutCubic(invLerp(7.0, 8.80, t));
        const gateDraw1 = smoothstep(7.5, 8.6, t);
        const gateDraw2 = smoothstep(7.8, 8.9, t);
        const gateDraw3 = smoothstep(8.1, 9.2, t);

        const fsz1 = clamp(W * 0.0064, 6.8, 8.6);
        const charW1 = getMonoCharW(fsz1, 700);
        const chars1Base = clamp(Math.floor((L.colW * 0.22) / charW1), 5, 8);
        const tokenHalfW1 = ((chars1Base + 1) * charW1 + 7) * 0.5;

        const cfgR1 = {
          tG1_0: 9.0,  tG1_1: 11.7,
          tG2_0: 12.1, tG2_1: 14.9,
          tG3_0: 15.3, tG3_1: 18.3,
          isR2: false,
          halfW: tokenHalfW1
        };

        let g1Pass = 0, g1Drop = 0, g1Started = false;
        let g2Pass = 0, g2Drop = 0, g2Started = false;
        let g3Pass = 0, g3Drop = 0, g3Started = false;
        let pulse1 = 0, pulse2 = 0, pulse3 = 0;

        const evals = new Array(R1.length);
        for (let i = 0; i < R1.length; i++) {
          const c = R1[i];
          const ev = evalGateParticle(c, t, cfgR1, L);
          const evPrev = evalGateParticle(c, Math.max(7.0, t - 0.07), cfgR1, L);
          evals[i] = { c, ev, evPrev };

          if (t >= ev.tHit1) {
            g1Started = true;
            if (c.drop === 1) { g1Drop++; if (t - ev.tHit1 < 0.25) pulse1 = Math.max(pulse1, 1 - (t - ev.tHit1) / 0.25); }
            else g1Pass++;
          }
          if (c.drop !== 1 && t >= ev.tHit2) {
            g2Started = true;
            if (c.drop === 2) { g2Drop++; if (t - ev.tHit2 < 0.25) pulse2 = Math.max(pulse2, 1 - (t - ev.tHit2) / 0.25); }
            else g2Pass++;
          }
          if (c.drop !== 1 && c.drop !== 2 && t >= ev.tHit3) {
            g3Started = true;
            if (c.drop === 3) { g3Drop++; if (t - ev.tHit3 < 0.25) pulse3 = Math.max(pulse3, 1 - (t - ev.tHit3) / 0.25); }
            else g3Pass++;
          }
        }

        // Draw 3 dedicated vertical score-axis filter columns (Y = ONLY actual CSV score!)
        drawFilterColumn(L.cols[0], L, gateDraw1, { pulse: pulse1, isActive: t >= 8.7 && t < 12.0 });
        drawFilterColumn(L.cols[1], L, gateDraw2, { pulse: pulse2, isActive: t >= 12.0 && t < 15.2 });
        drawFilterColumn(L.cols[2], L, gateDraw3, { pulse: pulse3, isActive: t >= 15.2 });

        // Empty Pass Zone aligned directly beside Filter 3's < 10 Å LOWER pass aperture!
        if (gateDraw3 > 0.35) {
          const allDone = g3Drop >= 63;
          const pa = smoothstep(0.35, 0.85, gateDraw3);
          fx.save();
          fx.globalAlpha = pa * (allDone ? 0.95 : 0.55);
          roundRectPath(L.xPassL, L.yPassTop + 2, L.passBoxW, (L.yPassBot - L.yPassTop) - 4, 8);
          fx.fillStyle = allDone ? "rgba(251, 113, 133, 0.06)" : "rgba(52, 211, 153, 0.035)";
          fx.fill();
          fx.strokeStyle = allDone ? "rgba(251, 113, 133, 0.44)" : "rgba(148, 163, 184, 0.20)";
          fx.setLineDash([4, 4]);
          fx.lineWidth = 1.3;
          fx.stroke();
          fx.setLineDash([]);

          fx.textAlign = "center";
          fx.textBaseline = "middle";
          fx.font = "700 10.5px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = allDone ? "#fb7185" : "rgba(148, 163, 184, 0.72)";
          fx.fillText(allDone ? "통과 후보 없음" : "최종 통과 구역", L.xPass, L.yPassMid - 9);
          fx.font = `600 9.5px ${MONO_FONT_FAM}`;
          fx.fillStyle = allDone ? "rgba(251, 113, 133, 0.78)" : "rgba(148, 163, 184, 0.56)";
          fx.fillText("PAE < 10 Å", L.xPass, L.yPassMid + 9);
          fx.restore();
        }

        // Detached lower candidate count strip (160 -> 126 -> 63 -> 0)
        drawFilterCountStrip(L, gateDraw1, {
          totalN: R1.length, isR2: false,
          g1Started, g1Pass, g1Drop,
          g2Started, g2Pass, g2Drop,
          g3Started, g3Pass, g3Drop,
          allDone: g3Drop >= 63
        });

        // Draw all 160 real amino-acid sequences at their EXACT CSV score Y positions!
        for (let pass = 0; pass < 3; pass++) {
          for (let i = 0; i < evals.length; i++) {
            const { c, ev, evPrev } = evals[i];
            const isDropped = (ev.status === "dropped" || ev.status === "bouncing");
            const isHero = (c === state.hoverCand) ||
              (c === R1_PLDDT_EDGE && t >= ev.tHit1 - 0.55 && t <= ev.tHit1 + 1.05) ||
              (c === R1_NEAR_EDGE && t >= ev.tHit2 - 0.65 && t <= ev.tHit2 + 1.15) ||
              (c === R1_BEST_D04 && t >= ev.tHit3 - 0.70 && t <= 18.95);
            const layer = isHero ? 2 : (isDropped ? 0 : 1);
            if (layer !== pass) continue;

            let x = ev.x, y = ev.y, px = evPrev.x, py = evPrev.y;
            if (t < 8.80) {
              const bb = bbScreen[c.bb];
              const off = getBackboneSeqOffset(c.si, cellW, cellH, 0, W, H);
              const sx = bb.sx + off.dx;
              const sy = bb.sy + off.dy;
              x = lerp(sx, ev.x, detachU);
              y = lerp(sy, ev.y, detachU);
              const dPrev = easeInOutCubic(invLerp(7.0, 8.80, Math.max(7.0, t - 0.06)));
              px = lerp(sx, evPrev.x, dPrev);
              py = lerp(sy, evPrev.y, dPrev);
            }

            let col = "#7dd3fc", borderCol = "rgba(56, 189, 248, 0.36)", trailCol = "#38bdf8";
            let dotCol = "#38bdf8";
            let alpha = 0.88, bgA = 0.60, fsz = fsz1, chars = chars1Base, glowCol = null, glowB = 0;

            if (ev.status === "bouncing") {
              const bp = clamp(ev.impactAge / 0.58, 0, 1);
              col = "#fb7185";
              dotCol = "#fb7185";
              borderCol = `rgba(251, 113, 133, ${(0.76 * (1 - bp)).toFixed(3)})`;
              trailCol = "#fb7185";
              alpha = lerp(0.98, 0.36, bp);
              bgA = lerp(0.68, 0.0, bp);
              fsz = lerp(fsz1 * 1.02, fsz1 * 0.86, bp);
            } else if (ev.status === "dropped") {
              col = "rgba(251, 146, 160, 0.92)";
              dotCol = "#fb7185";
              borderCol = null;
              alpha = 0.25;
              bgA = 0.0;
              fsz = fsz1 * 0.80;
              chars = Math.max(5, chars1Base - 1);
              px = null; py = null;
            } else if (c.bb === 3 && t > 14.8) {
              col = "#5eead4";
              dotCol = "#2dd4bf";
              borderCol = "rgba(45, 212, 191, 0.65)";
              trailCol = "#2dd4bf";
              alpha = 0.98;
              bgA = 0.76;
              fsz = fsz1 * 1.05;
              chars = Math.min(10, chars1Base + 1);
            } else if (ev.activeCol === 2) {
              col = "#99f6e4";
              dotCol = "#2dd4bf";
              borderCol = "rgba(45, 212, 191, 0.44)";
              trailCol = "#2dd4bf";
              alpha = 0.92;
              bgA = 0.66;
            } else if (ev.activeCol === 1) {
              col = "#67e8f9";
              dotCol = "#2dd4bf";
              borderCol = "rgba(45, 212, 191, 0.40)";
              trailCol = "#2dd4bf";
            }

            if (c === R1_PLDDT_EDGE && t >= ev.tHit1 - 0.55 && t <= ev.tHit1 + 1.05) {
              col = "#fda4af"; dotCol = "#fb7185";
              borderCol = "rgba(251, 113, 133, 0.92)"; glowCol = "rgba(251, 113, 133, 0.55)"; glowB = 10;
              alpha = 1.0; bgA = 0.88; fsz = fsz1 * 1.12; chars = Math.min(11, chars1Base + 2);
            } else if (c === R1_NEAR_EDGE && t >= ev.tHit2 - 0.65 && t <= ev.tHit2 + 1.15) {
              col = "#fde047"; dotCol = "#fbbf24";
              borderCol = "rgba(251, 191, 36, 0.90)"; glowCol = "rgba(251, 191, 36, 0.55)"; glowB = 10;
              alpha = 1.0; bgA = 0.88; fsz = fsz1 * 1.12; chars = Math.min(11, chars1Base + 2);
            } else if (c === R1_BEST_D04 && t >= ev.tHit3 - 0.70 && t <= 18.95) {
              col = "#5eead4"; dotCol = "#2dd4bf";
              borderCol = "rgba(45, 212, 191, 0.92)"; glowCol = "rgba(45, 212, 191, 0.60)"; glowB = 11;
              alpha = 1.0; bgA = 0.88; fsz = fsz1 * 1.12; chars = Math.min(11, chars1Base + 2);
            }

            const isHov = (state.hoverCand === c);
            if (isHov) { alpha = 1.0; bgA = Math.max(bgA, 0.90); col = "#ffffff"; }

            // Exact CSV score anchor dot (keeps exact vertical score distribution razor-sharp!)
            if (t >= 8.4) {
              fx.save();
              fx.globalAlpha = isHov ? 1.0 : (isDropped ? 0.68 : 0.90);
              fx.fillStyle = isHov ? "#ffffff" : dotCol;
              fx.beginPath();
              fx.arc(x, y, isHov ? 3.4 : (isDropped ? 2.4 : 2.1), 0, Math.PI * 2);
              fx.fill();
              fx.restore();
            }

            const box = drawSeqToken(x, y, c.seq, {
              chars,
              ellipsis: true,
              fontSize: fsz,
              weight: isHero ? 800 : 700,
              color: col,
              alpha,
              bgAlpha: bgA,
              borderColor: borderCol,
              glowColor: glowCol,
              glowBlur: glowB,
              prevX: px,
              prevY: py,
              trailColor: trailCol,
              isHovered: isHov
            });

            if (ev.impactAge >= 0 && ev.impactAge < 0.42) {
              drawRipple(ev.impactX, ev.impactY, ev.impactAge, 0.42, 18, "251, 113, 133");
            }
            if (ev.gateCrossFlash > 0.05) {
              drawRipple(ev.gateCrossX, ev.gateCrossY, (1 - ev.gateCrossFlash) * 0.36, 0.36, 12, "45, 212, 191");
            }

            c.hitX = x; c.hitY = y; c.hitHW = box.hw; c.hitHH = box.hh;
            c.visible = true; c.isDroppedVis = isDropped; c.activeCol = ev.activeCol;
          }
        }

        // Exact Y-axis Score Rulers & Micro-Callouts for Spotlight Candidates
        if (R1_PLDDT_EDGE) {
          const ev = evalGateParticle(R1_PLDDT_EDGE, t, cfgR1, L);
          const tShow0 = ev.tHit1 - 0.45, tShow1 = ev.tHit1 + 1.00;
          if (t >= tShow0 && t <= tShow1) {
            const a = smoothstep(tShow0, tShow0 + 0.22, t) * (1 - smoothstep(tShow1 - 0.30, tShow1, t));
            drawScoreRuler(L.cols[0], R1_PLDDT_EDGE.plddt.toFixed(1), ev.y1, ev.x, "#fb7185", a);
            const al = ev.x < L.cols[0].xL + L.cols[0].w * 0.58 ? "left" : "right";
            drawCallout(ev.x, ev.y1 + 36, "design_02_seq06", `pLDDT ${R1_PLDDT_EDGE.plddt.toFixed(2)} ≤ 80 · 탈락`, "#fb7185", a, al, true);
          }
        }
        if (R1_NEAR_EDGE) {
          const ev = evalGateParticle(R1_NEAR_EDGE, t, cfgR1, L);
          const tShow0 = ev.tHit2 - 0.55, tShow1 = ev.tHit2 + 1.05;
          if (t >= tShow0 && t <= tShow1) {
            const a = smoothstep(tShow0, tShow0 + 0.24, t) * (1 - smoothstep(tShow1 - 0.32, tShow1, t));
            drawScoreRuler(L.cols[1], `${R1_NEAR_EDGE.rmsd.toFixed(2)} Å`, ev.y2, ev.x, "#fbbf24", a);
            const al = ev.x < L.cols[1].xL + L.cols[1].w * 0.58 ? "left" : "right";
            drawCallout(ev.x, ev.y2 - 22, "design_13_seq03", `RMSD ${R1_NEAR_EDGE.rmsd.toFixed(2)} Å ≥ 1 Å · 탈락`, "#fbbf24", a, al, true);
          }
        }
        if (R1_BEST_D04) {
          const ev = evalGateParticle(R1_BEST_D04, t, cfgR1, L);
          const tShow0 = ev.tHit3 - 0.60, tShow1 = 18.88;
          if (t >= tShow0 && t <= tShow1) {
            const a = smoothstep(tShow0, tShow0 + 0.28, t) * (1 - smoothstep(18.40, 18.88, t));
            drawScoreRuler(L.cols[2], `${R1_BEST_D04.pae.toFixed(1)} Å`, ev.y3, ev.x, "#2dd4bf", a);
            const al = ev.x < L.cols[2].xL + L.cols[2].w * 0.56 ? "left" : "right";
            drawCallout(ev.x, ev.y3 - 14, "design_04_seq04", `최고 근접 · PAE ${R1_BEST_D04.pae.toFixed(2)} Å ≥ 10 Å`, "#2dd4bf", a, al, true);
          }
        }

        // Interactive Hover Y-Axis Score Ruler!
        if (state.hoverCand && state.hoverCand.visible && state.hoverCand.activeCol >= 0 && state.hoverCand.activeCol <= 2) {
          const hc = state.hoverCand;
          const col = L.cols[hc.activeCol];
          const val = hc[col.spec.key];
          drawScoreRuler(col, col.spec.fmt(val), mapScoreToY(val, col.spec, L), hc.hitX, "#f8fafc", 0.96);
        }
      }

      // -----------------------------------------------------------------------
      // BEAT 2 (19.0 -> 26.0s): Return to 20 Backbones -> Reveal design_04 (7/8)!
      // -----------------------------------------------------------------------
      if (t >= 19.0 && t < 26.0) {
        const { cellW, cellH } = getGalleryCellSize(W, H);
        const fsz2Base = clamp(cellW * 0.052, 7.2, 9.2);
        const charW2 = getMonoCharW(fsz2Base, 700);
        const chars2Base = clamp(Math.floor((Math.max(28, cellW * 0.30) - 8) / charW2), 5, 8);
        const fsz1Ref = clamp(W * 0.0064, 6.8, 8.6);
        const charW1Ref = getMonoCharW(fsz1Ref, 700);
        const chars1Ref = clamp(Math.floor((L1.colW * 0.22) / charW1Ref), 5, 8);
        const tokenHalfW1 = ((chars1Ref + 1) * charW1Ref + 7) * 0.5;

        const returnU = easeInOutCubic(invLerp(19.0, 21.0, t));
        const revealU = smoothstep(21.0, 22.6, t);
        const zoomU = easeInOutCubic(invLerp(23.0, 25.4, t));
        const fadeOthers = 1 - smoothstep(23.0, 24.8, t);
        const cfgR1End = {
          tG1_0: 9.0,  tG1_1: 11.7,
          tG2_0: 12.1, tG2_1: 14.9,
          tG3_0: 15.3, tG3_1: 18.3,
          halfW: tokenHalfW1
        };

        // Draw non-design_04 first, then design_04's 8 sequences crisp on top
        for (let pass = 0; pass < 2; pass++) {
          for (const c of R1) {
            const isD04 = (c.bb === 3);
            if ((pass === 0 && isD04) || (pass === 1 && !isD04)) continue;

            const alphaMul = isD04 ? 1.0 : fadeOthers;
            if (alphaMul <= 0.01) continue;

            const evOld = evalGateParticle(c, 18.99, cfgR1End, L);
            const bb = bbScreen[c.bb];
            const off = getBackboneSeqOffset(c.si, cellW, cellH, isD04 ? zoomU : 0, W, H);
            const tx = bb.sx + off.dx;
            const ty = bb.sy + off.dy;

            const x = lerp(evOld.x, tx, returnU);
            const y = lerp(evOld.y, ty, returnU);
            const rot = lerp(evOld.rot, 0, returnU);

            let col = "rgba(148, 163, 184, 0.85)", borderCol = null, glowCol = null, glowB = 0;
            let alpha = lerp(0.45, 0.24, revealU) * alphaMul;
            let bgA = lerp(0.32, 0.16, revealU);
            let fsz = fsz2Base;
            let chars = chars2Base;

            if (c.near) {
              col = isD04 ? "#5eead4" : "#fbbf24";
              borderCol = isD04
                ? `rgba(45, 212, 191, ${lerp(0.35, 0.88, revealU).toFixed(3)})`
                : `rgba(251, 191, 36, ${lerp(0.30, 0.72, revealU).toFixed(3)})`;
              alpha = lerp(0.55, 0.98, revealU) * alphaMul;
              bgA = lerp(0.50, 0.82, revealU);
              if (isD04) {
                fsz = lerp(fsz2Base, clamp(W * 0.0086, 9.2, 11.2), zoomU);
                chars = Math.round(lerp(chars2Base, clamp(Math.floor(W * 0.014), 12, 18), zoomU));
                glowCol = "rgba(45, 212, 191, 0.45)";
                glowB = lerp(0, 10, revealU);
              }
            } else if (isD04) {
              // design_04's 1 off-pose seq (seq01) stays softly visible in rose
              col = "#fda4af";
              borderCol = "rgba(251, 113, 133, 0.56)";
              alpha = lerp(0.42, 0.78, revealU);
              bgA = 0.70;
              fsz = lerp(fsz2Base, clamp(W * 0.0084, 9.0, 10.8), zoomU);
              chars = Math.round(lerp(chars2Base, clamp(Math.floor(W * 0.014), 12, 18), zoomU));
            }

            // Delicate leader filament on zoomed design_04 sequences (pointing right toward design_04!)
            if (isD04 && zoomU > 0.15) {
              fx.save();
              fx.strokeStyle = c.near
                ? `rgba(45, 212, 191, ${(0.28 * zoomU).toFixed(3)})`
                : `rgba(251, 113, 133, ${(0.22 * zoomU).toFixed(3)})`;
              fx.lineWidth = 0.95;
              fx.beginPath();
              fx.moveTo(bb.sx, bb.sy);
              fx.lineTo(x + 62 * zoomU, y);
              fx.stroke();
              fx.restore();
            }

            const isHov = (state.hoverCand === c);
            if (isHov) { alpha = 1.0; bgA = Math.max(bgA, 0.88); col = "#ffffff"; }

            const box = drawSeqToken(x, y, c.seq, {
              chars,
              ellipsis: isD04 && zoomU > 0.25,
              fontSize: fsz,
              weight: (isD04 && c.near) ? 800 : 700,
              color: col,
              alpha,
              bgAlpha: bgA,
              borderColor: borderCol,
              rot,
              glowColor: glowCol,
              glowBlur: glowB,
              isHovered: isHov
            });
            c.hitX = x; c.hitY = y; c.hitHW = box.hw; c.hitHH = box.hh;
            c.visible = alpha > 0.15;
          }
        }

        // Expanding highlight ring & clean callout above design_04 in gallery (clear of flanking seqs!)
        if (t >= 21.1 && t <= 24.4) {
          const ringR = Math.min(W, H) * 0.068;
          const a = smoothstep(21.1, 21.7, t) * (1 - smoothstep(23.6, 24.4, t));
          drawRipple(d04CenterScreen.sx, d04CenterScreen.sy, (t - 21.1) % 1.4, 1.4, ringR * 1.9, "45, 212, 191");
          drawCallout(d04CenterScreen.sx + cellW * 0.18, d04CenterScreen.sy - cellH * 0.44, "design_04", "7/8 접힘·배치 근접 · 1.19 Å", "#2dd4bf", a, "left");
        }

        // Target hotspot labels when TrkA fades in (24.6 -> 26.0s)
        if (t >= 24.6) {
          const ha = smoothstep(24.6, 25.4, t);
          for (const [lbl, pt] of [["Met108", LM.met108], ["Phe115", LM.phe115], ["Leu145", LM.leu145]]) {
            const pr = projectPoint(vpMat, pt, W, H);
            if (pr) drawCallout(pr.sx, pr.sy, lbl, null, "#fbbf24", ha * 0.85, "left");
          }
        }
      }

      // -----------------------------------------------------------------------
      // BEAT 3 (26.0 -> 33.5s): Peel Off 8 Old Seqs -> Lock Backbone -> Weave 50 New Seqs!
      // -----------------------------------------------------------------------
      if (t >= 26.0 && t < 33.5) {
        const { cellW, cellH } = getGalleryCellSize(W, H);

        // Phase 3A (26.0 -> 28.4s): Peel off & discard Round 1's 8 amino-acid sequences to the left!
        const peelU = easeInOutCubic(invLerp(26.1, 28.3, t));
        if (peelU < 0.995) {
          const d04R1 = R1.filter(c => c.bb === 3);
          const fszOld = clamp(W * 0.0085, 9.0, 11.0);
          const charsOld = clamp(Math.floor(W * 0.014), 12, 18);
          for (let k = 0; k < d04R1.length; k++) {
            const c = d04R1[k];
            const off = getBackboneSeqOffset(c.si, cellW, cellH, 1.0, W, H);
            const sx = d04CenterScreen.sx + off.dx;
            const sy = d04CenterScreen.sy + off.dy;
            const dx = -W * 0.22 * peelU;
            const dy = (k - 3.5) * 8 * peelU + 16 * peelU * peelU;
            const x = sx + dx;
            const y = sy + dy;
            const a = (1 - smoothstep(0.55, 1.0, peelU)) * (c.near ? 0.96 : 0.78);
            const turnedRose = peelU > 0.14;
            const box = drawSeqToken(x, y, c.seq, {
              chars: charsOld,
              ellipsis: true,
              fontSize: fszOld,
              weight: 700,
              color: turnedRose ? "#fb7185" : "#5eead4",
              alpha: a,
              bgAlpha: 0.74 * (1 - peelU * 0.45),
              borderColor: turnedRose ? "rgba(251, 113, 133, 0.62)" : "rgba(45, 212, 191, 0.70)",
              rot: -0.07 * peelU * (k % 2 === 0 ? 1 : -1),
              strikeProg: smoothstep(0.08, 0.45, peelU),
              isHovered: state.hoverCand === c
            });
            c.hitX = x; c.hitY = y; c.hitHW = box.hw; c.hitHH = box.hh; c.visible = a > 0.18;
          }

          // Floating minimal discard cue cleanly above the peeling sequence column
          const tagA = smoothstep(26.2, 26.7, t) * (1 - smoothstep(27.7, 28.4, t));
          if (tagA > 0.01) {
            fx.save();
            fx.globalAlpha = tagA;
            fx.textAlign = "center";
            fx.font = "700 13px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "#fb7185";
            fx.shadowColor = "rgba(7, 11, 18, 0.95)";
            fx.shadowBlur = 10;
            const cueX = Math.max(96, d04CenterScreen.sx - Math.min(W * 0.245, 255) - peelU * 36);
            const cueY = Math.max(98, d04CenterScreen.sy - Math.min(H * 0.30, 196) - 26);
            fx.fillText("← 1회차 서열 8 폐기", cueX, cueY);
            fx.restore();
          }
        }

        // Clean architectural corner frame around the locked 3D design_04 backbone (no overlap!)
        const lockA = smoothstep(27.0, 27.9, t) * (1 - smoothstep(33.0, 33.5, t));
        if (lockA > 0.01) {
          fx.save();
          fx.globalAlpha = lockA;
          const bw = Math.min(W, H) * 0.205;
          const bh = Math.min(W, H) * 0.345;
          const cx = d04CenterScreen.sx;
          const cy = d04CenterScreen.sy;
          const cLen = 16;
          fx.strokeStyle = "rgba(251, 191, 36, 0.50)";
          fx.lineWidth = 1.6;
          fx.beginPath();
          // 4 subtle Manim lock corner brackets
          fx.moveTo(cx - bw, cy - bh + cLen); fx.lineTo(cx - bw, cy - bh); fx.lineTo(cx - bw + cLen, cy - bh);
          fx.moveTo(cx + bw - cLen, cy - bh); fx.lineTo(cx + bw, cy - bh); fx.lineTo(cx + bw, cy - bh + cLen);
          fx.moveTo(cx - bw, cy + bh - cLen); fx.lineTo(cx - bw, cy + bh); fx.lineTo(cx - bw + cLen, cy + bh);
          fx.moveTo(cx + bw - cLen, cy + bh); fx.lineTo(cx + bw, cy + bh); fx.lineTo(cx + bw, cy + bh - cLen);
          fx.stroke();

          fx.textAlign = "center";
          fx.font = "800 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
          fx.fillStyle = "#fbbf24";
          fx.shadowColor = "rgba(7, 11, 18, 0.95)";
          fx.shadowBlur = 10;
          fx.fillText("design_04 · 뼈대 고정", cx, Math.min(H - 84, cy + bh + 20));
          fx.restore();
        }

        // Phase 3B (28.0 -> 33.5s): Weave 50 Brand-New Amino-Acid Sequences directly FROM the locked backbone!
        if (t >= 28.0) {
          // 1. Traveling emerald energy pulse along the actual 3D projected Cα ribbon of design_04!
          const weaveActive = smoothstep(28.0, 28.3, t) * (1 - smoothstep(32.8, 33.4, t));
          if (weaveActive > 0.01 && d04ScreenPts.length > 10) {
            const pulseHead = ((t - 28.0) * 3.8) % 1.0;
            const hiIdx = Math.floor(pulseHead * (d04ScreenPts.length - 1));
            fx.save();
            fx.lineCap = "round";
            for (let i = Math.max(0, hiIdx - 12); i < Math.min(d04ScreenPts.length - 1, hiIdx + 2); i++) {
              const p1 = d04ScreenPts[i], p2 = d04ScreenPts[i + 1];
              if (!p1 || !p2) continue;
              const fade = 1 - Math.abs(i - hiIdx) / 14;
              fx.strokeStyle = `rgba(52, 211, 153, ${(fade * 0.72 * weaveActive).toFixed(3)})`;
              fx.lineWidth = 3.5 * fade + 1;
              fx.beginPath();
              fx.moveTo(p1.sx, p1.sy);
              fx.lineTo(p2.sx, p2.sy);
              fx.stroke();
            }
            fx.restore();
          }

          // 2. Launch 50 brand-new actual AA sequence ribbons into a clean 5x10 matrix on the right!
          const M = getR2MatrixLayout(W, H);
          const fsz3 = clamp(M.colW * 0.078, 7.6, 9.8);
          const charW3 = getMonoCharW(fsz3, 700);
          const chars3 = clamp(Math.floor((M.colW - 18) / charW3), 8, 17);
          let spawnedR2 = 0;

          for (let i = 0; i < R2.length; i++) {
            const c = R2[i];
            const tSpawn = 28.05 + i * 0.088;
            const u = invLerp(tSpawn, tSpawn + 0.58, t);
            if (u <= 0) continue;
            spawnedR2++;

            const col = i % M.cols;
            const row = Math.floor(i / M.cols);
            const tx = M.x0 + (col + 0.5) * M.colW;
            const ty = M.y0 + (row + 0.5) * M.rowH;

            // Curved quadratic Bezier launch directly from a residue on design_04!
            const srcPt = d04ScreenPts[(i * 7) % Math.max(1, d04ScreenPts.length)] || d04CenterScreen;
            const e = easeOutCubic(u);
            const ctrlX = lerp(srcPt.sx, tx, 0.45);
            const ctrlY = lerp(srcPt.sy, ty, 0.5) - 34 * Math.sin((i + 1) * 0.6);
            const x = (1 - e)*(1 - e)*srcPt.sx + 2*(1 - e)*e*ctrlX + e*e*tx;
            const y = (1 - e)*(1 - e)*srcPt.sy + 2*(1 - e)*e*ctrlY + e*e*ty;

            const ePrev = easeOutCubic(Math.max(0, u - 0.14));
            const px = (1 - ePrev)*(1 - ePrev)*srcPt.sx + 2*(1 - ePrev)*ePrev*ctrlX + ePrev*ePrev*tx;
            const py = (1 - ePrev)*(1 - ePrev)*srcPt.sy + 2*(1 - ePrev)*ePrev*ctrlY + ePrev*ePrev*ty;

            const isHov = (state.hoverCand === c);
            const isFresh = u < 0.92;
            const box = drawSeqToken(x, y, c.seq, {
              chars: chars3,
              ellipsis: true,
              fontSize: fsz3,
              weight: 700,
              color: isHov ? "#ffffff" : "#6ee7b7",
              alpha: Math.min(0.96, u * 1.4),
              bgAlpha: 0.72,
              borderColor: isFresh ? "rgba(52, 211, 153, 0.78)" : "rgba(52, 211, 153, 0.36)",
              scale: lerp(0.72, 1.0, e),
              mutSet: c.mutSet,
              mutColor: "#fef08a",
              prevX: u < 0.96 ? px : null,
              prevY: u < 0.96 ? py : null,
              trailColor: "#34d399",
              isHovered: isHov
            });
            c.hitX = x; c.hitY = y; c.hitHW = box.hw; c.hitHH = box.hh; c.visible = true;
          }

          // Clean floating counter & cycling full amino-acid sequence preview
          const curSeq = R2[Math.min(49, Math.max(0, spawnedR2 - 1))];
          fx.save();
          fx.textAlign = "center";
          const cx = (M.x0 + M.x1) * 0.5;
          fx.font = "800 30px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "#34d399";
          fx.fillText(`+${spawnedR2}`, cx, M.y0 - 42);

          fx.font = "700 12px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(203, 213, 225, 0.85)";
          fx.fillText("새 서열 (기존과 중복 0 · 노란 글자: 변이 위치)", cx, M.y0 - 18);

          if (curSeq && curSeq.seq) {
            const availChars = clamp(Math.floor((M.x1 - M.x0 - 48) / 6.4), 22, curSeq.seq.length);
            const previewStr = curSeq.seq.slice(0, availChars) + (availChars < curSeq.seq.length ? "…" : "");
            const prefix = `${curSeq.id}  `;
            fx.font = `600 10.5px ${MONO_FONT_FAM}`;
            const cw = getMonoCharW(10.5, 600);
            const totalW = (prefix.length + previewStr.length) * cw;
            const startX = cx - totalW * 0.5;
            const py = M.y1 + 22;
            fx.textAlign = "left";
            fx.fillStyle = "rgba(148, 163, 184, 0.85)";
            fx.fillText(prefix, startX, py);
            const seqX = startX + prefix.length * cw;
            fx.fillStyle = "rgba(52, 211, 153, 0.78)";
            fx.fillText(previewStr, seqX, py);
            if (curSeq.mutSet) {
              fx.fillStyle = "#fef08a";
              for (let ci = 0; ci < availChars; ci++) {
                if (curSeq.mutSet.has(ci)) fx.fillText(curSeq.seq[ci], seqX + ci * cw, py);
              }
            }
          }
          fx.restore();
        }
      }

      // -----------------------------------------------------------------------
      // BEAT 4 (33.5 -> 43.0s): Round 2 IDENTICAL True Score-Axis 3-Filter Stage (50 -> 50 -> 47 -> 1!)
      // -----------------------------------------------------------------------
      if (t >= 33.5 && t < 43.0) {
        const gatherU = easeInOutCubic(invLerp(33.5, 34.50, t));
        const gateDraw = smoothstep(33.7, 34.65, t);

        const M = getR2MatrixLayout(W, H);
        const fsz4 = clamp(W * 0.0070, 7.4, 9.2);
        const charW4 = getMonoCharW(fsz4, 700);
        const chars4 = clamp(Math.floor((L.colW * 0.27) / charW4), 6, 10);
        const tokenHalfW2 = ((chars4 + 1) * charW4 + 8) * 0.5;

        const cfgR2 = {
          tG1_0: 34.7, tG1_1: 36.6,
          tG2_0: 37.0, tG2_1: 39.0,
          tG3_0: 39.4, tG3_1: 42.3,
          isR2: true,
          halfW: tokenHalfW2
        };

        let g1Pass = 0, g1Drop = 0, g1Started = false;
        let g2Pass = 0, g2Drop = 0, g2Started = false;
        let g3Pass = 0, g3Drop = 0, g3Started = false;
        let pulse1 = 0, pulse2 = 0, pulse3 = 0;

        const evals = new Array(R2.length);
        for (let i = 0; i < R2.length; i++) {
          const c = R2[i];
          const ev = evalGateParticle(c, t, cfgR2, L);
          const evPrev = evalGateParticle(c, Math.max(33.5, t - 0.07), cfgR2, L);
          evals[i] = { c, ev, evPrev };

          if (t >= ev.tHit1) {
            g1Started = true;
            if (c.drop === 1) g1Drop++;
            else { g1Pass++; if (t - ev.tHit1 < 0.25) pulse1 = Math.max(pulse1, 1 - (t - ev.tHit1) / 0.25); }
          }
          if (c.drop !== 1 && t >= ev.tHit2) {
            g2Started = true;
            if (c.drop === 2) { g2Drop++; if (t - ev.tHit2 < 0.25) pulse2 = Math.max(pulse2, 1 - (t - ev.tHit2) / 0.25); }
            else g2Pass++;
          }
          if (c.drop !== 1 && c.drop !== 2 && t >= ev.tHit3) {
            g3Started = true;
            if (c.drop === 3) { g3Drop++; if (t - ev.tHit3 < 0.25) pulse3 = Math.max(pulse3, 1 - (t - ev.tHit3) / 0.25); }
            else { g3Pass++; if (t - ev.tHit3 < 0.85) pulse3 = Math.max(pulse3, 1 - (t - ev.tHit3) / 0.85); }
          }
        }

        // Draw exact same 3 vertical score-axis filter columns!
        drawFilterColumn(L.cols[0], L, gateDraw, { pulse: pulse1, isPassedAll: g1Pass >= 50, isActive: t >= 34.5 && t < 36.9 });
        drawFilterColumn(L.cols[1], L, gateDraw, { pulse: pulse2, isActive: t >= 36.9 && t < 39.3 });
        drawFilterColumn(L.cols[2], L, gateDraw, { pulse: pulse3, isPassedAll: g3Pass >= 1, isActive: t >= 39.3 });

        // Exact CSV median comparison markers on Column 3 (PAE entering G3: R1 26.2 Å vs R2 19.7 Å)
        if (gateDraw > 0.6 && t > 39.0) {
          const cmpA = smoothstep(39.0, 39.8, t) * 0.86;
          const col3 = L.cols[2];
          const yMed1 = mapScoreToY(26.21, col3.spec, L);
          const yMed2 = mapScoreToY(19.74, col3.spec, L);
          const drawMedTag = (yPos, txt, strokeCol, textCol) => {
            fx.setLineDash([3, 3]);
            fx.lineWidth = 1;
            fx.strokeStyle = strokeCol;
            fx.beginPath(); fx.moveTo(col3.xL, yPos); fx.lineTo(col3.xR, yPos); fx.stroke();
            fx.setLineDash([]);
            fx.font = `700 9.5px ${MONO_FONT_FAM}`;
            const tw = fx.measureText(txt).width;
            const bw = tw + 8, bh = 14;
            const bx = col3.xR - bw - 5, by = yPos - bh - 2;
            roundRectPath(bx, by, bw, bh, 3.5);
            fx.fillStyle = "rgba(7, 11, 18, 0.84)";
            fx.fill();
            fx.textAlign = "center";
            fx.textBaseline = "middle";
            fx.fillStyle = textCol;
            fx.fillText(txt, bx + bw * 0.5, by + bh * 0.5 + 0.5);
          };
          fx.save();
          fx.globalAlpha = cmpA;
          drawMedTag(yMed1, "1차 중앙 26.2 Å", "rgba(148, 163, 184, 0.45)", "rgba(203, 213, 225, 0.90)");
          drawMedTag(yMed2, "2차 중앙 19.7 Å", "rgba(45, 212, 191, 0.55)", "#5eead4");
          fx.restore();
        }

        // Pass Zone aligned directly beside Filter 3's < 10 Å LOWER pass aperture!
        if (gateDraw > 0.35) {
          const won = g3Pass >= 1;
          const pa = smoothstep(0.35, 0.85, gateDraw);
          fx.save();
          fx.globalAlpha = pa * (won ? 1.0 : 0.55);
          roundRectPath(L.xPassL, L.yPassTop + 2, L.passBoxW, (L.yPassBot - L.yPassTop) - 4, 8);
          fx.fillStyle = won ? "rgba(16, 185, 129, 0.11)" : "rgba(52, 211, 153, 0.035)";
          fx.fill();
          fx.strokeStyle = won ? "rgba(52, 211, 153, 0.78)" : "rgba(148, 163, 184, 0.22)";
          fx.setLineDash(won ? [] : [4, 4]);
          fx.lineWidth = won ? 1.8 : 1.3;
          fx.stroke();
          fx.setLineDash([]);

          if (!won) {
            fx.textAlign = "center";
            fx.textBaseline = "middle";
            fx.font = "700 10.5px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "rgba(148, 163, 184, 0.72)";
            fx.fillText("최종 통과 구역", L.xPass, L.yPassMid - 9);
            fx.font = `600 9.5px ${MONO_FONT_FAM}`;
            fx.fillStyle = "rgba(52, 211, 153, 0.72)";
            fx.fillText("PAE < 10 Å", L.xPass, L.yPassMid + 9);
          }
          fx.restore();
        }

        // Detached lower candidate count strip (50 -> 50 -> 47 -> 1)
        drawFilterCountStrip(L, gateDraw, {
          totalN: R2.length, isR2: true,
          g1Started, g1Pass, g1Drop,
          g2Started, g2Pass, g2Drop,
          g3Started, g3Pass, g3Drop,
          allDone: (g3Pass + g3Drop) >= 47
        });

        // Label cleanly beneath the anchored rotating 3D design_04 backbone on far left
        if (gateDraw > 0.3) {
          fx.save();
          fx.globalAlpha = gateDraw * 0.90;
          fx.textAlign = "center";
          fx.shadowColor = "rgba(7, 11, 18, 0.95)";
          fx.shadowBlur = 10;
          const lblY = Math.min(L.dividerY - 26, d04CenterScreen.sy + Math.min(W, H) * 0.20);
          fx.font = `800 12px ${MONO_FONT_FAM}`;
          fx.fillStyle = "#2dd4bf";
          fx.fillText("design_04", d04CenterScreen.sx, lblY);
          fx.font = "600 10.5px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(148, 163, 184, 0.84)";
          fx.fillText("뼈대 1 × 새 서열 50", d04CenterScreen.sx, lblY + 15);
          fx.restore();
        }

        // Draw all 50 real Round-2 amino-acid sequences at their EXACT CSV score Y positions!
        for (let pass = 0; pass < 3; pass++) {
          for (let i = 0; i < evals.length; i++) {
            const { c, ev, evPrev } = evals[i];
            const isDropped = (ev.status === "dropped" || ev.status === "bouncing");
            const isWin = (ev.status === "passed");
            const isRmsdSpot = (c === R2_RMSD_EDGE && t >= ev.tHit2 - 0.55 && t <= ev.tHit2 + 1.15);
            const layer = (isWin || isRmsdSpot || c === state.hoverCand) ? 2 : (isDropped ? 0 : 1);
            if (layer !== pass) continue;

            let x = ev.x, y = ev.y, px = evPrev.x, py = evPrev.y;
            if (t < 34.50) {
              const colIdx = i % M.cols;
              const rowIdx = Math.floor(i / M.cols);
              const sx = M.x0 + (colIdx + 0.5) * M.colW;
              const sy = M.y0 + (rowIdx + 0.5) * M.rowH;
              x = lerp(sx, ev.x, gatherU);
              y = lerp(sy, ev.y, gatherU);
              const gPrev = easeInOutCubic(invLerp(33.5, 34.50, Math.max(33.5, t - 0.06)));
              px = lerp(sx, evPrev.x, gPrev);
              py = lerp(sy, evPrev.y, gPrev);
            }

            let col = "#6ee7b7", dotCol = "#34d399", borderCol = "rgba(52, 211, 153, 0.44)", trailCol = "#34d399";
            let alpha = 0.94, bgA = 0.72, fsz = fsz4, chars = chars4, glowCol = null, glowB = 0;
            let lines = 1, useMut = true;

            if (isWin) {
              const winGrow = easeOutCubic(invLerp(ev.tHit3, ev.tHit3 + 0.60, t));
              const passCharW = getMonoCharW(clamp(fsz4 * 1.06, 8.6, 10.6), 800);
              const perLine = clamp(Math.floor((L.passBoxW - 18) / passCharW), 9, 16);
              col = "#6ee7b7";
              dotCol = "#34d399";
              borderCol = "rgba(52, 211, 153, 0.96)";
              glowCol = "rgba(52, 211, 153, 0.65)";
              glowB = 14 + Math.sin(t * 5.5) * 3;
              alpha = 1.0;
              bgA = 0.92;
              fsz = lerp(fsz4, clamp(fsz4 * 1.06, 8.6, 10.6), winGrow);
              chars = Math.round(lerp(chars4, perLine * 2 - 1, winGrow));
              lines = winGrow > 0.35 ? 2 : 1;
            } else if (ev.status === "bouncing") {
              const bp = clamp(ev.impactAge / 0.58, 0, 1);
              col = "#fb7185"; dotCol = "#fb7185";
              borderCol = `rgba(251, 113, 133, ${(0.78 * (1 - bp)).toFixed(3)})`;
              trailCol = "#fb7185";
              alpha = lerp(0.98, 0.38, bp);
              bgA = lerp(0.72, 0.0, bp);
              fsz = lerp(fsz4 * 1.03, fsz4 * 0.86, bp);
              useMut = false;
            } else if (ev.status === "dropped") {
              col = "rgba(251, 146, 160, 0.92)";
              dotCol = "#fb7185";
              borderCol = null;
              alpha = 0.28;
              bgA = 0.0;
              fsz = fsz4 * 0.82;
              chars = Math.max(6, chars4 - 2);
              px = null; py = null;
              useMut = false;
            }

            if (isRmsdSpot) {
              col = "#fda4af"; dotCol = "#fb7185";
              borderCol = "rgba(251, 113, 133, 0.92)"; glowCol = "rgba(251, 113, 133, 0.52)"; glowB = 10;
              alpha = 1.0; bgA = 0.88; fsz = fsz4 * 1.08;
            }

            const isHov = (state.hoverCand === c);
            if (isHov) { alpha = 1.0; bgA = Math.max(bgA, 0.90); col = "#ffffff"; }

            if (t >= 34.2 && !isWin) {
              fx.save();
              fx.globalAlpha = isHov ? 1.0 : (isDropped ? 0.72 : 0.92);
              fx.fillStyle = isHov ? "#ffffff" : dotCol;
              fx.beginPath();
              fx.arc(x, y, isHov ? 3.5 : (isDropped ? 2.5 : 2.2), 0, Math.PI * 2);
              fx.fill();
              fx.restore();
            }

            const box = drawSeqToken(x, y, c.seq, {
              chars,
              ellipsis: true,
              fontSize: fsz,
              weight: (isWin || isRmsdSpot) ? 800 : 700,
              color: col,
              alpha,
              bgAlpha: bgA,
              borderColor: borderCol,
              borderWidth: isWin ? 1.35 : 0.85,
              glowColor: glowCol,
              glowBlur: glowB,
              mutSet: useMut ? c.mutSet : null,
              mutColor: "#fef08a",
              prevX: px,
              prevY: py,
              trailColor: trailCol,
              isHovered: isHov,
              lines
            });

            if (ev.impactAge >= 0 && ev.impactAge < 0.42) {
              drawRipple(ev.impactX, ev.impactY, ev.impactAge, 0.42, 20, "251, 113, 133");
            }
            if (ev.gateCrossFlash > 0.05) {
              drawRipple(ev.gateCrossX, ev.gateCrossY, (1 - ev.gateCrossFlash) * (isWin ? 0.95 : 0.36), isWin ? 0.95 : 0.36, isWin ? 52 : 14, "52, 211, 153");
            }

            c.hitX = x; c.hitY = y; c.hitHW = box.hw; c.hitHH = box.hh;
            c.visible = true; c.isDroppedVis = isDropped; c.activeCol = ev.activeCol;
          }
        }

        // Spotlight ruler for Round 2's 3 RMSD drops (right above 1 Å!)
        if (R2_RMSD_EDGE) {
          const ev = evalGateParticle(R2_RMSD_EDGE, t, cfgR2, L);
          const tShow0 = ev.tHit2 - 0.45, tShow1 = ev.tHit2 + 1.10;
          if (t >= tShow0 && t <= tShow1) {
            const a = smoothstep(tShow0, tShow0 + 0.22, t) * (1 - smoothstep(tShow1 - 0.32, tShow1, t));
            drawScoreRuler(L.cols[1], `${R2_RMSD_EDGE.rmsd.toFixed(2)} Å`, ev.y2, ev.x, "#fb7185", a);
            const al = ev.x < L.cols[1].xL + L.cols[1].w * 0.56 ? "left" : "right";
            drawCallout(ev.x, ev.y2 - 22, "design_04_r14 등 3개", `RMSD 1.10–1.22 Å ≥ 1 Å`, "#fb7185", a, al, true);
          }
        }

        // Winning r22 exact PAE 9.39 Å score ruler + Pass Zone readout!
        if (R2_WINNER && t >= 40.6) {
          const evW = evalGateParticle(R2_WINNER, t, cfgR2, L);
          const rulerA = smoothstep(40.6, 41.1, t);
          drawScoreRuler(L.cols[2], `${R2_WINNER.pae.toFixed(2)} Å`, evW.y3, Math.min(L.cols[2].xR, evW.x), "#34d399", rulerA);

          if (g3Pass >= 1) {
            const a = smoothstep(evW.tHit3, evW.tHit3 + 0.35, t);
            const labelY = clamp(evW.yPassFinal + 28, L.yPassTop + 48, L.yPassBot - 44);
            fx.save();
            fx.globalAlpha = a;
            fx.textAlign = "center";
            fx.textBaseline = "top";
            fx.shadowColor = "rgba(7, 11, 18, 0.95)";
            fx.shadowBlur = 10;
            fx.font = `800 12px ${MONO_FONT_FAM}`;
            fx.fillStyle = "#34d399";
            fx.fillText("design_04_r22", L.xPass, labelY);
            fx.font = "600 10px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "rgba(203, 213, 225, 0.94)";
            fx.fillText(`PAE ${R2_WINNER.pae.toFixed(2)} Å · RMSD ${R2_WINNER.rmsd.toFixed(2)} Å`, L.xPass, labelY + 15);
            fx.font = "600 9.5px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "rgba(52, 211, 153, 0.88)";
            fx.fillText(`pLDDT ${R2_WINNER.plddt.toFixed(1)} · 유일 통과`, L.xPass, labelY + 29);
            fx.restore();
          }
        }

        // Interactive Hover Y-Axis Score Ruler!
        if (state.hoverCand && state.hoverCand.visible && state.hoverCand.activeCol >= 0 && state.hoverCand.activeCol <= 2) {
          const hc = state.hoverCand;
          const col = L.cols[hc.activeCol];
          const val = hc[col.spec.key];
          drawScoreRuler(col, col.spec.fmt(val), mapScoreToY(val, col.spec, L), hc.hitX, "#f8fafc", 0.96);
        }
      }

      // -----------------------------------------------------------------------
      // BEAT 5 (43.0 -> 49.0s): Morph r22 Sequence -> Full 3D Complex + Minimal Labels
      // -----------------------------------------------------------------------
      if (t >= 43.0) {
        // Winning r22 amino-acid sequence string unfurls & glides into center as 3D complex materializes!
        if (t < 44.6 && R2_WINNER) {
          const u = easeInOutCubic(invLerp(43.0, 44.45, t));
          const r22StartY = clamp(mapScoreToY(R2_WINNER.pae, FILTER_SPECS[2], L2), L2.yPassTop + 22, L2.yPassBot - 44);
          const ox = lerp(L2.xPass, W * 0.46, u);
          const oy = lerp(r22StartY, H * 0.50, u);
          const a = 1 - smoothstep(43.75, 44.6, t);
          const fsz5 = clamp(W * 0.0092, 9.5, 12.2);
          const maxC = clamp(Math.floor((W * 0.62) / getMonoCharW(fsz5, 800)), 26, R2_WINNER.seq.length);
          const curChars = Math.round(lerp(24, maxC, u));
          drawSeqToken(ox, oy, R2_WINNER.seq, {
            chars: curChars,
            ellipsis: curChars < R2_WINNER.seq.length,
            fontSize: fsz5,
            weight: 800,
            color: "#6ee7b7",
            alpha: a,
            bgAlpha: 0.84 * a,
            borderColor: "rgba(52, 211, 153, 0.92)",
            borderWidth: 1.3,
            glowColor: "rgba(52, 211, 153, 0.75)",
            glowBlur: 18,
            mutSet: R2_WINNER.mutSet,
            mutColor: "#fef08a",
            lines: u < 0.35 ? 2 : 1
          });
          drawRipple(ox, oy, t - 43.2, 1.15, 95, "45, 212, 191");
        }

        // Crisp 3D projected landmark labels (Hotspots + N/C)
        const lblA = smoothstep(44.5, 45.5, t);
        if (lblA > 0.02) {
          for (const [lbl, pt, colHex, align] of [
            ["Phe115", LM.phe115, "#fbbf24", "left"],
            ["Leu145", LM.leu145, "#fbbf24", "left"],
            ["Met108", LM.met108, "#fbbf24", "left"],
            ["N", LM.nTerm, "#99f6e4", "right"],
            ["C", LM.cTerm, "#2dd4bf", "right"]
          ]) {
            const pr = projectPoint(vpMat, pt, W, H);
            if (pr) drawCallout(pr.sx, pr.sy, lbl, null, colHex, lblA * 0.92, align);
          }

          // Subtle actual 73-AA sequence ribbon of winning design_04_r22 tucked beneath top-left title
          if (R2_WINNER && W >= 720) {
            fx.save();
            fx.globalAlpha = lblA * 0.85;
            const fszS = clamp(W * 0.0074, 8.2, 10.0);
            const cw = getMonoCharW(fszS, 600);
            const maxChars = Math.min(R2_WINNER.seq.length, Math.floor((W * 0.48) / cw));
            const disp = R2_WINNER.seq.slice(0, maxChars) + (maxChars < R2_WINNER.seq.length ? "…" : "");
            fx.font = `600 ${fszS.toFixed(1)}px ${MONO_FONT_FAM}`;
            fx.textAlign = "left";
            fx.textBaseline = "top";
            fx.shadowColor = "rgba(7, 11, 18, 0.95)";
            fx.shadowBlur = 8;
            fx.fillStyle = "rgba(94, 234, 212, 0.78)";
            fx.fillText(disp, 30, 72);
            if (R2_WINNER.mutSet) {
              fx.fillStyle = "rgba(254, 240, 138, 0.92)";
              for (let ci = 0; ci < maxChars; ci++) {
                if (R2_WINNER.mutSet.has(ci)) fx.fillText(R2_WINNER.seq[ci], 30 + ci * cw, 72);
              }
            }
            fx.restore();
          }

          // Top-right clean floating metric strip (zero box, pure typography!)
          fx.save();
          fx.globalAlpha = lblA;
          fx.textAlign = "right";
          fx.textBaseline = "top";
          const metrics = [
            ["PAE", "9.39 Å", "#34d399"],
            ["pLDDT", "89.6", "#2dd4bf"],
            ["RMSD", "0.70 Å", "#2dd4bf"],
            ["배치", "1.41 Å", "#fbbf24"]
          ];
          let rx = W - 32;
          for (let i = metrics.length - 1; i >= 0; i--) {
            const [k, v, cHex] = metrics[i];
            fx.font = "800 18px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = cHex;
            fx.fillText(v, rx, 28);
            const vw = fx.measureText(v).width;
            fx.font = "600 10.5px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "rgba(148, 163, 184, 0.85)";
            fx.fillText(k, rx, 51);
            rx -= Math.max(vw, 44) + 24;
          }

          // Subtle violet backbone comparison note when active
          const autoOverlay = (t >= 44.9 && t <= 47.5)
            ? smoothstep(44.9, 45.6, t) * (1 - smoothstep(46.8, 47.5, t))
            : 0.0;
          const ovA = state.showDesignOverlay ? 1.0 : autoOverlay;
          if (ovA > 0.05) {
            fx.globalAlpha = ovA;
            fx.font = "700 12px 'Pretendard Variable', Pretendard, sans-serif";
            fx.fillStyle = "#c4b5fd";
            fx.fillText("보라색 선: 재사용한 design_04 원본 뼈대 (편차 0.70 Å)", W - 32, 74);
          }
          fx.restore();
        }
      }

      // -----------------------------------------------------------------------
      // FLOATING TOP-LEFT MANIM CHAPTER TITLE (Pure Typography, Zero Box!)
      // -----------------------------------------------------------------------
      const bIdx = currentBeatIndex(t);
      const beat = BEATS[bIdx];
      const titleIn = smoothstep(beat.start, beat.start + 0.45, t);
      const titleOut = (bIdx < BEATS.length - 1) ? (1 - smoothstep(beat.end - 0.35, beat.end, t)) : 1.0;
      const titleA = titleIn * titleOut;

      fx.save();
      fx.globalAlpha = titleA;
      fx.textAlign = "left";
      fx.textBaseline = "top";
      fx.shadowColor = "rgba(7, 11, 18, 0.92)";
      fx.shadowBlur = 12;

      fx.font = "800 11px 'Pretendard Variable', Pretendard, sans-serif";
      fx.fillStyle = beat.tagCol;
      fx.fillText(beat.tag, 30, 24);

      if (beat.titleSegs) {
        drawSegmentedText(30, 42, beat.titleSegs, "800 22px 'Pretendard Variable', Pretendard, sans-serif", "left");
      } else {
        fx.font = "800 22px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "#f1f5f9";
        fx.fillText(beat.title, 30, 42);
      }
      fx.restore();

      fx.restore(); // end DPR transform

      syncTransportUI(bIdx);
    }

    // =========================================================================
    // 9. TRANSPORT BAR, SCRUBBER, KEYBOARD & HOVER / 3D ORBIT
    // =========================================================================
    const btnPlay = document.getElementById("btn-play");
    const btnReplay = document.getElementById("btn-replay");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnDesign = document.getElementById("btn-design");
    const btnCamReset = document.getElementById("btn-cam-reset");
    const extraTools = document.getElementById("extra-tools");
    const scrubWrap = document.getElementById("scrub-wrap");
    const scrubFill = document.getElementById("scrub-fill");
    const scrubThumb = document.getElementById("scrub-thumb");
    const scrubTicks = document.getElementById("scrub-ticks");
    const scrubLabelEls = Array.from(document.querySelectorAll("#scrub-labels span"));
    const tipEl = document.getElementById("tip");

    // Populate beat boundary ticks on scrubber track
    for (let i = 1; i < BEATS.length; i++) {
      const tk = document.createElement("div");
      tk.className = "scrub-tick";
      tk.style.left = ((BEATS[i].start / T_TOTAL) * 100).toFixed(2) + "%";
      scrubTicks.appendChild(tk);
    }

    function syncTransportUI(bIdx) {
      const pct = clamp((state.t / T_TOTAL) * 100, 0, 100);
      scrubFill.style.width = pct.toFixed(2) + "%";
      scrubThumb.style.left = pct.toFixed(2) + "%";

      const finished = state.t >= T_TOTAL - 0.02 && !state.playing;
      if (state.playing) {
        btnPlay.textContent = "⏸ 일시정지";
      } else if (finished) {
        btnPlay.textContent = "↺ 처음부터 재생";
      } else {
        btnPlay.textContent = "▶ 재생";
      }

      btnPrev.disabled = (state.t <= 0.05);
      btnNext.disabled = (bIdx >= BEATS.length - 1 && state.t >= T_TOTAL - 0.15);

      for (let i = 0; i < scrubLabelEls.length; i++) {
        scrubLabelEls[i].classList.toggle("is-cur", i === bIdx);
      }

      extraTools.classList.toggle("is-show", bIdx === BEATS.length - 1);
      btnDesign.classList.toggle("is-violet", state.showDesignOverlay);
    }

    function playFromStart() {
      resetUserCam();
      state.t = 0.0;
      state.stopAt = null;
      state.playing = true;
    }

    function stepNext() {
      resetUserCam();
      const bIdx = currentBeatIndex(state.t);
      const cur = BEATS[bIdx];
      // If we are near the start/middle of the current beat and paused, finish current beat;
      // otherwise smoothly play through the next beat and pause at its settled end!
      if (!state.playing && state.t < cur.end - 0.6) {
        state.stopAt = cur.end - 0.05;
        state.playing = true;
      } else if (bIdx < BEATS.length - 1) {
        const nxt = BEATS[bIdx + 1];
        if (state.t < nxt.start) state.t = nxt.start;
        state.stopAt = nxt.end - 0.05;
        state.playing = true;
      } else {
        state.t = T_TOTAL;
        state.playing = false;
        state.stopAt = null;
      }
    }

    function stepPrev() {
      resetUserCam();
      const bIdx = currentBeatIndex(state.t);
      const cur = BEATS[bIdx];
      const targetIdx = (state.t > cur.start + 1.2) ? bIdx : Math.max(0, bIdx - 1);
      state.t = BEATS[targetIdx].start;
      state.stopAt = BEATS[targetIdx].end - 0.05;
      state.playing = true;
    }

    btnPlay.addEventListener("click", () => {
      if (state.playing) {
        state.playing = false;
        state.stopAt = null;
      } else if (state.t >= T_TOTAL - 0.05) {
        playFromStart();
      } else {
        state.stopAt = null;
        state.playing = true;
      }
    });

    btnReplay.addEventListener("click", playFromStart);
    btnNext.addEventListener("click", stepNext);
    btnPrev.addEventListener("click", stepPrev);

    btnDesign.addEventListener("click", () => {
      state.showDesignOverlay = !state.showDesignOverlay;
    });
    btnCamReset.addEventListener("click", resetUserCam);

    // Continuous Scrubber Dragging
    let scrubbing = false;
    function scrubToClientX(clientX) {
      const rect = scrubWrap.getBoundingClientRect();
      const u = clamp((clientX - rect.left) / Math.max(1, rect.width), 0, 1);
      resetUserCam();
      state.t = u * T_TOTAL;
      state.stopAt = null;
      state.playing = false;
    }
    scrubWrap.addEventListener("pointerdown", (e) => {
      scrubbing = true;
      scrubWrap.setPointerCapture(e.pointerId);
      scrubToClientX(e.clientX);
    });
    scrubWrap.addEventListener("pointermove", (e) => {
      if (scrubbing) scrubToClientX(e.clientX);
    });
    scrubWrap.addEventListener("pointerup", () => { scrubbing = false; });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); btnPlay.click(); }
      else if (e.code === "ArrowRight") { e.preventDefault(); stepNext(); }
      else if (e.code === "ArrowLeft") { e.preventDefault(); stepPrev(); }
      else if (e.key === "r" || e.key === "R") { playFromStart(); }
    });

    // 3D Orbit + Zoom + Orb/Residue Hover Picking
    let dragging = false, lastX = 0, lastY = 0;

    glCanvas.addEventListener("pointerdown", (e) => {
      if (state.t < 22.0) return;
      dragging = true;
      glCanvas.setPointerCapture(e.pointerId);
      lastX = e.clientX; lastY = e.clientY;
      if (!state.userOrbitQuat) {
        state.userOrbitQuat = computeCamera(state.t).quat.slice();
      }
      tipEl.style.display = "none";
    });

    glCanvas.addEventListener("pointermove", (e) => {
      if (dragging) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        const sens = 0.0072;
        const qY = qAxisAngle([0, 1, 0], -dx * sens);
        const qX = qAxisAngle([1, 0, 0], -dy * sens);
        state.userOrbitQuat = qNorm(qMul(state.userOrbitQuat, qMul(qY, qX)));
        return;
      }

      const rect = glCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      // 1. Check Round-1 or Round-2 visible amino-acid sequence tokens (prioritize alive over dropped)
      function hitTestSeqList(list) {
        let best = null, bestScore = 1e9;
        for (const c of list) {
          if (!c.visible) continue;
          const dx = Math.abs(c.hitX - mx);
          const dy = Math.abs(c.hitY - my);
          const padX = 5, padY = 4;
          if (dx <= c.hitHW + padX && dy <= c.hitHH + padY) {
            const score = (c.isDroppedVis ? 1000 : 0) + Math.hypot(dx, dy);
            if (score < bestScore) { bestScore = score; best = c; }
          }
        }
        return best;
      }

      let hitSeq = hitTestSeqList(R2);
      let isR2Hit = !!hitSeq;
      if (!hitSeq) hitSeq = hitTestSeqList(R1);
      state.hoverCand = hitSeq;

      if (hitSeq) {
        const name = isR2Hit ? `design_04_${hitSeq.id}` : hitSeq.id;
        const accent = hitSeq.pass ? "#34d399" : (hitSeq.near ? "#2dd4bf" : "#7dd3fc");
        let seqHtml = hitSeq.seq || "";
        if (isR2Hit && hitSeq.mutSet && hitSeq.mutSet.size > 0 && hitSeq.seq) {
          let buf = "";
          for (let ci = 0; ci < hitSeq.seq.length; ci++) {
            buf += hitSeq.mutSet.has(ci) ? `<span class="mut">${hitSeq.seq[ci]}</span>` : hitSeq.seq[ci];
          }
          seqHtml = buf;
        }
        const statusText = hitSeq.pass
          ? `<span style="color:#34d399;font-weight:700;">✓ 3단계 모두 통과</span>`
          : hitSeq.drop === 1
            ? `<span style="color:#fb7185;font-weight:700;">✕ 1단계 탈락 (pLDDT ${hitSeq.plddt.toFixed(2)} ≤ 80)</span>`
            : hitSeq.drop === 2
              ? `<span style="color:#fb7185;font-weight:700;">✕ 2단계 탈락 (접힘 RMSD ${hitSeq.rmsd.toFixed(3)} Å ≥ 1 Å)</span>`
              : `<span style="color:#fb7185;font-weight:700;">✕ 3단계 탈락 (계면 PAE ${hitSeq.pae.toFixed(2)} Å ≥ 10 Å)</span>`;
        tipEl.innerHTML =
          `<div class="tip-id" style="color:${accent};">${name}</div>` +
          `<div class="tip-val">pLDDT ${hitSeq.plddt.toFixed(2)} · RMSD ${hitSeq.rmsd.toFixed(3)} Å · PAE ${hitSeq.pae.toFixed(2)} Å</div>` +
          `<div class="tip-val">${statusText}</div>` +
          (seqHtml ? `<div class="tip-seq">${seqHtml}</div>` : "");
        tipEl.style.display = "block";
        const tipW = Math.min(350, state.cssW - 24);
        tipEl.style.left = Math.min(state.cssW - tipW - 10, Math.max(10, mx + 14)) + "px";
        tipEl.style.top = Math.min(state.cssH - 110, Math.max(10, my - 72)) + "px";
        return;
      }

      // 2. Check 3D residue hover on Final Complex (Beat 5)
      if (state.t >= 44.5 && state.lastVpMat) {
        let bestRes = null, bestScore = 1e9;
        const chains = [
          { label: "결합체 r22", hex: "#2dd4bf", ch: "A", pts: predA, seq: R22.seqA, rStart: R22.rStartA },
          { label: "표적 TrkA", hex: "#94a3b8", ch: "B", pts: predB, seq: R22.seqB, rStart: R22.rStartB }
        ];
        for (const ch of chains) {
          for (let i = 0; i < ch.pts.length; i++) {
            const pr = projectPoint(state.lastVpMat, ch.pts[i], state.cssW, state.cssH);
            if (!pr) continue;
            const d2 = (pr.sx - mx) ** 2 + (pr.sy - my) ** 2;
            if (d2 < 144) {
              const sc = pr.ndcZ * 30 + Math.sqrt(d2);
              if (sc < bestScore) { bestScore = sc; bestRes = { ch, idx: i }; }
            }
          }
        }
        if (bestRes) {
          const { ch, idx } = bestRes;
          const rNum = ch.rStart + idx;
          const aa3 = AA1TO3[ch.seq[idx]] || ch.seq[idx];
          const hot = (ch.ch === "B" && HOTSPOT_NUMS.has(rNum)) ? ' <span style="color:#fbbf24;">★ 접점</span>' : "";
          tipEl.innerHTML = `<div class="tip-id" style="color:${ch.hex};">${ch.label} · ${aa3} ${rNum}${hot}</div>`;
          tipEl.style.display = "block";
          tipEl.style.left = Math.min(state.cssW - 200, Math.max(10, mx + 14)) + "px";
          tipEl.style.top = Math.min(state.cssH - 50, Math.max(10, my - 36)) + "px";
          return;
        }
      }

      tipEl.style.display = "none";
    });

    glCanvas.addEventListener("pointerup", () => { dragging = false; });
    glCanvas.addEventListener("pointerleave", () => { dragging = false; state.hoverCand = null; tipEl.style.display = "none"; });
    glCanvas.addEventListener("dblclick", resetUserCam);
    glCanvas.addEventListener("wheel", (e) => {
      if (state.t < 22.0) return;
      e.preventDefault();
      state.userZoomFactor = clamp(state.userZoomFactor * Math.exp(e.deltaY * 0.0011), 0.42, 2.2);
    }, { passive: false });

    // Expose inspection hook for automated verification
    window.__CINEMA__ = {
      seek: (tSec, pause = true) => {
        resetUserCam();
        state.t = clamp(tSec, 0, T_TOTAL);
        state.playing = !pause;
        state.stopAt = null;
        renderFrame(state.t);
      },
      getState: () => ({
        t: Number(state.t.toFixed(3)),
        beat: currentBeatIndex(state.t),
        playing: state.playing,
        r1Count: R1.length,
        r2Count: R2.length,
        backboneCount: BACKBONES.length,
        webglOk: !!gl
      })
    };

    // =========================================================================
    // 10. MAIN 60FPS ANIMATION LOOP
    // =========================================================================
    let prevTs = performance.now();
    function tick(ts) {
      const dt = Math.min(0.05, (ts - prevTs) / 1000);
      prevTs = ts;

      if (state.playing) {
        state.t += dt;
        if (state.stopAt !== null && state.t >= state.stopAt) {
          state.t = state.stopAt;
          state.playing = false;
          state.stopAt = null;
        } else if (state.t >= T_TOTAL) {
          state.t = T_TOTAL;
          state.playing = false;
          state.stopAt = null;
        }
      } else if (state.t >= T_TOTAL - 0.01 && !dragging && !state.userOrbitQuat) {
        state.orbitClock += dt;
      }

      renderFrame(state.t);
      requestAnimationFrame(tick);
    }

    renderFrame(state.t);
    requestAnimationFrame(tick);
  })();
  </script>
</body>
