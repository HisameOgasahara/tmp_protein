<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrkA 단백질 결합체 AI 설계 — 1·2회차 애니메이션</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #070b12;
      --ink: #f1f5f9;
      --ink-2: #cbd5e1;
      --ink-muted: #7c8da6;
      --teal: #2dd4bf;
      --teal-bright: #99f6e4;
      --sky: #38bdf8;
      --amber: #fbbf24;
      --rose: #fb7185;
      --emerald: #34d399;
      --violet: #a78bfa;
      --border: rgba(148, 163, 184, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1;
      user-select: none;
      -webkit-user-select: none;
    }

    .cinema {
      position: fixed;
      inset: 0;
      background: radial-gradient(72% 68% at 50% 46%, #0d192b 0%, #070b12 78%);
      touch-action: none;
    }

    #gl-canvas, #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #gl-canvas {
      cursor: grab;
    }
    #gl-canvas:active {
      cursor: grabbing;
    }

    #fx-canvas {
      pointer-events: none;
    }

    /* Minimal Hover Tooltip (only appears when hovering a sequence or 3D residue) */
    .tip {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      display: none;
      background: rgba(7, 11, 18, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.30);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--ink);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.62);
      white-space: nowrap;
      max-width: min(350px, calc(100vw - 24px));
    }
    .tip-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800;
      font-size: 11.5px;
    }
    .tip-val {
      color: var(--ink-2);
      font-size: 11px;
      margin-top: 2px;
    }
    .tip-seq {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.48;
      letter-spacing: 0.04em;
      color: rgba(153, 246, 228, 0.92);
      white-space: normal;
      word-break: break-all;
    }
    .tip-seq .mut {
      color: #fde047;
      font-weight: 800;
    }

    /* Ultra-clean floating cinema transport bar (bottom center) */
    .transport {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(9, 14, 24, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.52);
      max-width: calc(100vw - 24px);
    }

    .t-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }

    .t-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 38, 0.72);
      color: var(--ink-2);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: border-color 0.16s, background 0.16s, color 0.16s, transform 0.12s;
      white-space: nowrap;
    }

    .t-btn:hover:not(:disabled) {
      border-color: rgba(148, 163, 184, 0.42);
      color: #ffffff;
      background: rgba(24, 36, 58, 0.88);
    }
    .t-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .t-btn:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    .t-btn.is-icon {
      width: 32px;
      padding: 0;
      font-size: 13px;
    }

    .t-btn.is-primary {
      border-color: rgba(45, 212, 191, 0.44);
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.24), rgba(20, 184, 166, 0.12));
      color: var(--teal-bright);
    }
    .t-btn.is-primary:hover:not(:disabled) {
      border-color: var(--teal);
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.34), rgba(20, 184, 166, 0.20));
      color: #ffffff;
    }

    .t-btn.is-violet {
      border-color: rgba(167, 139, 250, 0.45);
      background: rgba(167, 139, 250, 0.16);
      color: #ddd6fe;
    }

    .t-sep {
      width: 1px;
      height: 18px;
      background: rgba(148, 163, 184, 0.18);
      flex: 0 0 auto;
    }

    /* Interactive 6-chapter continuous timeline scrubber */
    .scrub-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(360px, 34vw);
      height: 32px;
      cursor: pointer;
      flex: 1 1 auto;
      padding: 0 4px;
    }

    .scrub-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.20);
      overflow: visible;
    }

    .scrub-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sky) 0%, var(--amber) 48%, var(--emerald) 100%);
      pointer-events: none;
    }

    .scrub-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: #f8fafc;
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .scrub-ticks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scrub-tick {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 8px;
      border-radius: 1px;
      background: rgba(7, 11, 18, 0.85);
      transform: translate(-50%, -50%);
    }

    .scrub-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--ink-muted);
      letter-spacing: -0.01em;
      pointer-events: none;
    }

    .scrub-labels span {
      transition: color 0.18s;
      white-space: nowrap;
    }
    .scrub-labels span.is-cur {
      color: var(--ink);
    }

    .extra-tools {
      display: none;
      align-items: center;
      gap: 5px;
    }
    .extra-tools.is-show {
      display: flex;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 14px;
      color: var(--ink-2);
      background: var(--bg);
      z-index: 40;
    }

    @media (max-width: 820px) {
      .transport { padding: 6px 10px; gap: 7px; bottom: 12px; }
      .scrub-wrap { width: 160px; }
      .scrub-labels { display: none; }
      .t-btn { height: 30px; padding: 0 10px; font-size: 11.5px; }
      .t-btn.is-icon { width: 30px; }
    }
  </style>
</head>
<body>
  <div class="cinema" id="cinema">
    <canvas id="gl-canvas" aria-label="TrkA 결합체 1·2회차 3D 분자 무대"></canvas>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
  </div>

  <div class="tip" id="tip"></div>

  <div class="transport" role="region" aria-label="애니메이션 재생 제어">
    <div class="t-group">
      <button type="button" class="t-btn is-primary" id="btn-play" title="재생 / 일시정지 (Space)">⏸ 일시정지</button>
      <button type="button" class="t-btn is-icon" id="btn-replay" title="처음부터 재생">↺</button>
    </div>

    <span class="t-sep" aria-hidden="true"></span>

    <div class="t-group">
      <button type="button" class="t-btn is-icon" id="btn-prev" title="이전 단계 (←)">←</button>
      <button type="button" class="t-btn" id="btn-next" title="다음 단계 (→)">다음 →</button>
    </div>

    <div class="scrub-wrap" id="scrub-wrap" title="드래그하거나 클릭해 탐색">
      <div class="scrub-track">
        <div class="scrub-fill" id="scrub-fill"></div>
        <div class="scrub-ticks" id="scrub-ticks"></div>
        <div class="scrub-thumb" id="scrub-thumb"></div>
      </div>
      <div class="scrub-labels" id="scrub-labels">
        <span data-b="0">160</span>
        <span data-b="1">1차 필터</span>
        <span data-b="2">design_04</span>
        <span data-b="3">재사용</span>
        <span data-b="4">2차 필터</span>
        <span data-b="5">r22</span>
      </div>
    </div>

    <div class="extra-tools" id="extra-tools">
      <span class="t-sep" aria-hidden="true"></span>
      <button type="button" class="t-btn" id="btn-design" title="원본 design_04 뼈대 겹쳐 보기">뼈대 비교</button>
      <button type="button" class="t-btn is-icon" id="btn-cam-reset" title="시점 복원">⌖</button>
    </div>
  </div>

  <div class="fallback" id="fallback">
    이 브라우저에서는 WebGL 3D를 초기화할 수 없습니다.<br />하드웨어 가속이 켜진 최신 브라우저에서 열어 주세요.
  </div>

    // Deterministic low-discrepancy Van der Corput / golden hash
    function vdc(n, base = 2) {
      let f = 1, r = 0;
      let i = n + 1;
      while (i > 0) {
        f /= base;
        r += f * (i % base);
        i = Math.floor(i / base);
      }
      return r;

    function hash01(seed) {
      const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    // Clamp & easing helpers
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const invLerp = (a, b, x) => clamp((x - a) / Math.max(1e-6, b - a), 0, 1);

      const u = invLerp(a, b, x);

    const easeOutCubic = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);

      const x = clamp(u, 0, 1);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

    const easeOutBack = (u) => {
      const x = clamp(u, 0, 1);
      const c1 = 1.5, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };

    // Vector & Quaternion math (matching summary-report.html)
    const vAdd = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
    const vSub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
    const vScale = (a, s) => [a[0]*s, a[1]*s, a[2]*s];
    const vDot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
    const vCross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
    const vLen = (a) => Math.hypot(a[0], a[1], a[2]);
    const vNorm = (a) => { const l = vLen(a); return l > 1e-8 ? [a[0]/l, a[1]/l, a[2]/l] : [0, 1, 0]; };
    const vLerp = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

    function qNorm(q) {

        a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
        a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
        a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]
      ];
    }
    function qAxisAngle(axis, rad) {
      const s = Math.sin(rad * 0.5);
      const a = vNorm(axis);
      return [a[0]*s, a[1]*s, a[2]*s, Math.cos(rad * 0.5)];
    }
    function qRot(q, v) {
      const qv = [q[0], q[1], q[2]];
      const t = vScale(vCross(qv, v), 2.0);
      return vAdd(v, vAdd(vScale(t, q[3]), vCross(qv, t)));

      let dot = a[0]*bx + a[1]*by + a[2]*bz + a[3]*bw;
      if (dot < 0) { dot = -dot; bx = -bx; by = -by; bz = -bz; bw = -bw; }
      if (dot > 0.9995) {

      const th0 = Math.acos(clamp(dot, -1, 1));
      const sin0 = Math.sin(th0);
      const s0 = Math.sin((1 - t) * th0) / sin0;
      const s1 = Math.sin(t * th0) / sin0;
      return [a[0]*s0 + bx*s1, a[1]*s0 + by*s1, a[2]*s0 + bz*s1, a[3]*s0 + bw*s1];

        0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3),
        0.5 * ((2*p1[2]) + (-p0[2]+p2[2])*t + (2*p0[2]-5*p1[2]+4*p2[2]-p3[2])*t2 + (-p0[2]+3*p1[2]-3*p2[2]+p3[2])*t3)
      ];
    }

    // Palette matching summary-report.html
    const COL = {
      target:   [0.58, 0.65, 0.74],
      slate:    [0.56, 0.62, 0.71],
      dimSlate: [0.16, 0.21, 0.30],
      sky:      [0.22, 0.74, 0.97],
      teal:     [0.18, 0.83, 0.75],
      tealHi:   [0.60, 0.96, 0.89],
      emerald:  [0.20, 0.83, 0.60],
      amber:    [0.98, 0.75, 0.14],
      rose:     [0.98, 0.44, 0.52],
      violet:   [0.66, 0.55, 0.98],
      hotC:     [0.95, 0.73, 0.20],
      bindC:    [0.22, 0.82, 0.76],
      el: {
        N: [0.38, 0.65, 0.98],
        O: [0.97, 0.44, 0.44],
        S: [0.98, 0.80, 0.08]
      }
    };

    function binderGradColor(t) {
      if (t <= 0.55) return vLerp([0.60, 0.96, 0.89], [0.18, 0.83, 0.75], t / 0.55);
      return vLerp([0.18, 0.83, 0.75], [0.05, 0.58, 0.53], (t - 0.55) / 0.45);
    }

    const AA1TO3 = {
      A:"Ala", R:"Arg", N:"Asn", D:"Asp", C:"Cys", Q:"Gln", E:"Glu", G:"Gly", H:"His", I:"Ile",
      L:"Leu", K:"Lys", M:"Met", F:"Phe", P:"Pro", S:"Ser", T:"Thr", W:"Trp", Y:"Tyr", V:"Val"
    };
    const HOTSPOT_NUMS = new Set([108, 115, 145]);

    // =========================================================================
    // 2. WEBGL 3D ENGINE (summary-report.html shading + per-object transforms)
    // =========================================================================
    const glCanvas = document.getElementById("gl-canvas");
    const fxCanvas = document.getElementById("fx-canvas");
    const fx = fxCanvas.getContext("2d");
    const gl = glCanvas.getContext("webgl", { antialias: true, alpha: true, premultipliedAlpha: true });

    if (!gl) {
      document.getElementById("fallback").style.display = "flex";
      return;
    }

    const VS_SRC = `
      attribute vec3 aPos;
      attribute vec3 aNorm;
      attribute vec3 aCol;
      uniform mat4 uViewProj;
      uniform vec3 uObjPos;
      uniform float uObjScale;
      uniform vec4 uObjQuat;
      varying vec3 vPos;
      varying vec3 vNorm;
      varying vec3 vCol;

      vec3 qrot(vec4 q, vec3 v) {
        vec3 t = 2.0 * cross(q.xyz, v);
        return v + q.w * t + cross(q.xyz, t);
      }

      void main() {
        vec3 wp = uObjPos + qrot(uObjQuat, aPos * uObjScale);
        vec3 wn = qrot(uObjQuat, aNorm);
        vPos = wp;
        vNorm = wn;
        vCol = aCol;
        gl_Position = uViewProj * vec4(wp, 1.0);
      }
    `;

    const FS_SRC = `
      precision mediump float;
      varying vec3 vPos;
      varying vec3 vNorm;
      varying vec3 vCol;
      uniform vec3 uCamPos;
      uniform vec3 uLight1;
      uniform vec3 uLight2;
      uniform float uAlpha;
      uniform float uFogStart;
      uniform float uFogEnd;
      uniform float uEmissive;
      uniform vec3 uTintCol;
      uniform float uTintMix;

      void main() {
        vec3 N = normalize(vNorm);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(uCamPos - vPos);
        vec3 base = mix(vCol, uTintCol, uTintMix);

        float diff1 = max(dot(N, uLight1), 0.0);
        float diff2 = max(dot(N, uLight2), 0.0);
        vec3 H1 = normalize(uLight1 + V);
        float spec = pow(max(dot(N, H1), 0.0), 36.0) * 0.34;
        float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5) * 0.24;

        vec3 ambient = base * 0.31;
        vec3 lit = ambient
          + base * (diff1 * 0.65 + diff2 * 0.24)
          + vec3(0.95, 0.98, 1.0) * spec
          + mix(base, vec3(0.84, 0.95, 1.0), 0.45) * rim
          + base * uEmissive;

        float dist = length(uCamPos - vPos);
        float fog = clamp((dist - uFogStart) / max(uFogEnd - uFogStart, 1.0), 0.0, 0.40);
        vec3 bgCol = vec3(0.031, 0.047, 0.078);
        vec3 finalCol = mix(lit, bgCol, fog);
        gl_FragColor = vec4(finalCol, uAlpha);
      }
    `;

    function compileShader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS_SRC));
    gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS_SRC));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const LOC = {
      aPos:      gl.getAttribLocation(prog, "aPos"),
      aNorm:     gl.getAttribLocation(prog, "aNorm"),
      aCol:      gl.getAttribLocation(prog, "aCol"),
      uViewProj: gl.getUniformLocation(prog, "uViewProj"),
      uObjPos:   gl.getUniformLocation(prog, "uObjPos"),
      uObjScale: gl.getUniformLocation(prog, "uObjScale"),
      uObjQuat:  gl.getUniformLocation(prog, "uObjQuat"),
      uCamPos:   gl.getUniformLocation(prog, "uCamPos"),
      uLight1:   gl.getUniformLocation(prog, "uLight1"),
      uLight2:   gl.getUniformLocation(prog, "uLight2"),
      uAlpha:    gl.getUniformLocation(prog, "uAlpha"),
      uFogStart: gl.getUniformLocation(prog, "uFogStart"),
      uFogEnd:   gl.getUniformLocation(prog, "uFogEnd"),
      uEmissive: gl.getUniformLocation(prog, "uEmissive"),
      uTintCol:  gl.getUniformLocation(prog, "uTintCol"),
      uTintMix:  gl.getUniformLocation(prog, "uTintMix")
    };

    // Geometry Builder
    function makeUnitSphere() {
      const t = (1 + Math.sqrt(5)) / 2;
      let verts = [
        [-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],
        [0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],
        [t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]
      ].map(vNorm);
      let faces = [
        [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
        [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
        [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
        [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
      ];
      const midCache = new Map();
      const mid = (i, j) => {
        const key = i < j ? i + "_" + j : j + "_" + i;
        if (midCache.has(key)) return midCache.get(key);
        const m = vNorm(vAdd(verts[i], verts[j]));
        const idx = verts.length;
        verts.push(m);
        midCache.set(key, idx);
        return idx;
      };
      const nf = [];
      for (const [a, b, c] of faces) {
        const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        nf.push([a,ab,ca], [b,bc,ab], [c,ca,bc], [ab,bc,ca]);
      }
      return { verts, faces: nf };
    }
    const UNIT_SPHERE = makeUnitSphere();

    class MeshBuilder {
      constructor() { this.pos = []; this.norm = []; this.col = []; this.idx = []; }
      addVert(p, n, c) {
        const id = this.pos.length / 3;
        this.pos.push(p[0], p[1], p[2]);
        this.norm.push(n[0], n[1], n[2]);
        this.col.push(c[0], c[1], c[2]);
        return id;
      }
      addTri(a, b, c) { this.idx.push(a, b, c); }
      addSphere(center, radius, color) {
        const base = this.pos.length / 3;
        for (const v of UNIT_SPHERE.verts) {
          this.pos.push(center[0]+v[0]*radius, center[1]+v[1]*radius, center[2]+v[2]*radius);
          this.norm.push(v[0], v[1], v[2]);
          this.col.push(color[0], color[1], color[2]);
        }
        for (const [a, b, c] of UNIT_SPHERE.faces) this.idx.push(base+a, base+b, base+c);
      }
      addCylinder(p1, p2, radius, c1, c2, segs = 8) {
        const d = vSub(p2, p1);
        const len = vLen(d);
        if (len < 1e-5) return;
        const axis = vScale(d, 1 / len);
        const ref = Math.abs(axis[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const u = vNorm(vCross(axis, ref));
        const v = vCross(axis, u);
        const base = this.pos.length / 3;
        const col2 = c2 || c1;
        for (let i = 0; i <= segs; i++) {
          const ang = (i / segs) * Math.PI * 2;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const n = [u[0]*ca + v[0]*sa, u[1]*ca + v[1]*sa, u[2]*ca + v[2]*sa];
          this.pos.push(p1[0]+n[0]*radius, p1[1]+n[1]*radius, p1[2]+n[2]*radius);
          this.norm.push(n[0], n[1], n[2]);
          this.col.push(c1[0], c1[1], c1[2]);
          this.pos.push(p2[0]+n[0]*radius, p2[1]+n[1]*radius, p2[2]+n[2]*radius);
          this.norm.push(n[0], n[1], n[2]);
          this.col.push(col2[0], col2[1], col2[2]);
        }
        for (let i = 0; i < segs; i++) {
          const a = base + i * 2;
          this.idx.push(a, a+1, a+2, a+2, a+1, a+3);
        }
      }
      upload() {
        const mesh = {
          vboPos: gl.createBuffer(), vboNorm: gl.createBuffer(),
          vboCol: gl.createBuffer(), ibo: gl.createBuffer(), count: this.idx.length
        };
        gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vboPos);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.pos), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vboNorm);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.norm), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vboCol);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.col), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(this.idx), gl.STATIC_DRAW);
        return mesh;
      }
    }

    function buildProteinMesh(caPts, coVecs, ssStr, opts = {}) {
      const {
        mode = "cartoon",
        colorFn = null,
        baseColor = COL.teal,
        widthScale = 1.0,
        thickScale = 1.0,
        tubeRadius = 0.34,
        sub = 5,
        ringSegs = 8
      } = opts;

      const n = caPts.length;
      const mb = new MeshBuilder();
      const resT = new Array(n);
      const resW = new Array(n);
      for (let i = 0; i < n; i++) {
        const prev = caPts[Math.max(0, i - 1)];
        const next = caPts[Math.min(n - 1, i + 1)];
        resT[i] = vNorm(vSub(next, prev));
      }

      const rawW = new Array(n);
      for (let i = 0; i < n; i++) {
        const s = ssStr[i];
        let w;
        if (s === "H" && i > 0 && i < n - 1) {
          const curv = vAdd(vSub(caPts[i-1], caPts[i]), vSub(caPts[i+1], caPts[i]));
          const rad = vNorm(vSub(curv, vScale(resT[i], vDot(curv, resT[i]))));
          w = vNorm(vCross(resT[i], rad));
        } else if (coVecs && coVecs[i]) {
          const co = coVecs[i];
          w = vNorm(vSub(co, vScale(resT[i], vDot(co, resT[i]))));
        } else {
          w = vNorm(vCross(resT[i], Math.abs(resT[i][1]) < 0.9 ? [0,1,0] : [1,0,0]));
        }
        rawW[i] = w;
      }

      resW[0] = rawW[0];
      for (let i = 1; i < n; i++) {
        let w = rawW[i];
        if (vDot(w, resW[i - 1]) < 0) w = vScale(w, -1);
        resW[i] = w;
      }
      for (let pass = 0; pass < 2; pass++) {
        const copy = resW.slice();
        for (let i = 1; i < n - 1; i++) {
          if (ssStr[i] === ssStr[i-1] && ssStr[i] === ssStr[i+1]) {
            const avg = vAdd(vAdd(vScale(copy[i-1], 0.25), vScale(copy[i], 0.5)), vScale(copy[i+1], 0.25));
            resW[i] = vNorm(vSub(avg, vScale(resT[i], vDot(avg, resT[i]))));
          }
        }
      }

      const samples = [];
      for (let i = 0; i < n - 1; i++) {
        const p0 = caPts[Math.max(0, i - 1)], p1 = caPts[i], p2 = caPts[i + 1], p3 = caPts[Math.min(n - 1, i + 2)];
        const s1 = ssStr[i], s2 = ssStr[i + 1];
        const isArrowSeg = (s1 === "E" && (i === n - 2 || ssStr[i + 1] !== "E"));
        const c1 = colorFn ? colorFn(i) : baseColor;
        const c2 = colorFn ? colorFn(i + 1) : baseColor;
        const steps = (i === n - 2) ? sub : sub - 1;
        for (let k = 0; k <= steps; k++) {
          const u = k / sub;
          const pos = (mode === "tube") ? vLerp(p1, p2, u) : catmullRom(p0, p1, p2, p3, u);
          const wInterp = vNorm(vLerp(resW[i], resW[i + 1], u));
          const col = vLerp(c1, c2, u);
          let hw, hh;
          if (mode === "tube") {
            hw = tubeRadius; hh = tubeRadius;
          } else {
            const dimFor = (sc) => sc === "H" ? [1.08*widthScale, 0.26*thickScale]
              : sc === "E" ? [1.02*widthScale, 0.22*thickScale]
              : [0.30*Math.max(0.85, widthScale*0.9), 0.30*Math.max(0.85, thickScale*0.9)];
            const d1 = dimFor(s1), d2 = dimFor(s2);
            if (isArrowSeg) {
              hw = (1.68*(1-u) + 0.26*u) * widthScale;
              hh = (0.25*(1-u) + 0.24*u) * thickScale;
            } else {
              const sm = u * u * (3 - 2 * u);
              hw = d1[0] + (d2[0] - d1[0]) * sm;
              hh = d1[1] + (d2[1] - d1[1]) * sm;
            }
          }
          samples.push({ pos, wGuide: wInterp, hw, hh, col });
        }
      }

      const m = samples.length;
      let prevW = null;
      for (let i = 0; i < m; i++) {
        const a = samples[Math.max(0, i - 1)].pos, b = samples[Math.min(m - 1, i + 1)].pos;
        const T = vNorm(vSub(b, a));
        let W = vSub(samples[i].wGuide, vScale(T, vDot(samples[i].wGuide, T)));
        if (vLen(W) < 1e-4) W = prevW ? vSub(prevW, vScale(T, vDot(prevW, T))) : vCross(T, [0, 1, 0]);
        W = vNorm(W);
        if (prevW && vDot(W, prevW) < 0) W = vScale(W, -1);
        prevW = W;
        const N = vNorm(vCross(T, W));
        samples[i].T = T; samples[i].W = W; samples[i].N = N;
      }

      const stride = ringSegs + 1;
      for (let i = 0; i < m; i++) {
        const { pos, W, N, hw, hh, col } = samples[i];
        for (let j = 0; j <= ringSegs; j++) {
          const ang = (j / ringSegs) * Math.PI * 2;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const px = pos[0] + W[0]*hw*ca + N[0]*hh*sa;
          const py = pos[1] + W[1]*hw*ca + N[1]*hh*sa;
          const pz = pos[2] + W[2]*hw*ca + N[2]*hh*sa;
          const nx = W[0]*(ca/hw) + N[0]*(sa/hh);
          const ny = W[1]*(ca/hw) + N[1]*(sa/hh);
          const nz = W[2]*(ca/hw) + N[2]*(sa/hh);
          mb.addVert([px, py, pz], vNorm([nx, ny, nz]), col);
        }
      }
      for (let i = 0; i < m - 1; i++) {
        const r0 = i * stride, r1 = (i + 1) * stride;
        for (let j = 0; j < ringSegs; j++) {
          mb.addTri(r0 + j, r1 + j, r0 + j + 1);
          mb.addTri(r0 + j + 1, r1 + j, r1 + j + 1);
        }
      }
      return mb.upload();
    }

    function buildSidechainMesh(scList, carbonTint, stickR, atomR) {
      const mb = new MeshBuilder();
      for (const res of scList) {
        const coords = res.xyz, els = res.el;
        const colFor = (i) => els[i] === "C" ? carbonTint : (COL.el[els[i]] || carbonTint);
        for (const [i, j] of res.b) {
          const p1 = coords[i], p2 = coords[j], mid = vLerp(p1, p2, 0.5);
          const c1 = colFor(i), c2 = colFor(j);
          mb.addCylinder(p1, mid, stickR, c1, c1, 7);
          mb.addCylinder(mid, p2, stickR, c2, c2, 7);
        }
        for (let i = 0; i < coords.length; i++) {
          mb.addSphere(coords[i], els[i] === "S" ? atomR * 1.25 : atomR, colFor(i));
        }
      }
      return mb.upload();
    }

    // Build all 3D protein meshes once
    const DES_CENTROID = DATA.desCentroid; // [-11.447, -4.118, 0.125]
    const R22 = DATA.r22;
    const LM = R22.landmarks;

    // 5x4 Gallery layout for the 20 backbones
    const GRID_COLS = 5, GRID_ROWS = 4;
    const GRID_DX = 46, GRID_DY = 38;
    const BACKBONES = DATA.backbones.map((b, idx) => {
      const col = idx % GRID_COLS;
      const row = Math.floor(idx / GRID_COLS);
      const gx = (col - (GRID_COLS - 1) * 0.5) * GRID_DX;
      const gy = ((GRID_ROWS - 1) * 0.5 - row) * GRID_DY + 2;
      const ca = unpackVec3(b.ca);
      const co = unpackVec3(b.co);
      const n = ca.length;
      const mesh = buildProteinMesh(ca, co, b.ss, {
        mode: "cartoon",
        colorFn: b.chosen ? (i) => binderGradColor(i / Math.max(1, n - 1)) : null,
        baseColor: COL.slate,
        widthScale: b.chosen ? 1.06 : 0.96,
        thickScale: 0.95,
        sub: b.chosen ? 6 : 4,
        ringSegs: b.chosen ? 10 : 7
      });
      return {
        idx, id: b.id, len: b.len, near: b.near, chosen: b.chosen,
        ca, gridPos: [gx, gy, 0], mesh
      };
    });
    const D04 = BACKBONES.find(b => b.chosen);

    // 8 real Round-1 predicted structures of design_04 (for Beat 2 ghost fit shimmer)
    const R1_D04_MESHES = DATA.r1D04.map((d) => {
      const ca = unpackVec3(d.ca);
      const co = unpackVec3(d.co);
      return {
        id: d.id, near: d.near, pae: d.pae, rmsd: d.rmsd, tRmsd: d.tRmsd,
        mesh: buildProteinMesh(ca, co, R22.ssA, {
          mode: "tube",
          baseColor: d.near ? COL.teal : COL.rose,
          tubeRadius: d.near ? 0.32 : 0.28,
          sub: 3, ringSegs: 7
        })
      };
    });

    // Full r22 x TrkA Complex meshes (matching summary-report.html)
    const predA = unpackVec3(R22.pred.A.ca);
    const predAo = unpackVec3(R22.pred.A.co);
    const predB = unpackVec3(R22.pred.B.ca);
    const predBo = unpackVec3(R22.pred.B.co);
    const desA = unpackVec3(R22.design.A.ca);
    const desAo = unpackVec3(R22.design.A.co);

    const COMPLEX = {
      target: buildProteinMesh(predB, predBo, R22.ssB, { mode: "cartoon", baseColor: COL.target, sub: 6, ringSegs: 10 }),
      binder: buildProteinMesh(predA, predAo, R22.ssA, {
        mode: "cartoon",
        colorFn: (i) => binderGradColor(i / Math.max(1, predA.length - 1)),
        widthScale: 1.08, thickScale: 0.96, sub: 6, ringSegs: 10
      }),
      designOverlay: buildProteinMesh(desA, desAo, R22.ssA, {
        mode: "tube", baseColor: COL.violet, tubeRadius: 0.27, sub: 4, ringSegs: 8
      }),
      scHot: buildSidechainMesh(R22.scHot, COL.hotC, 0.16, 0.23),
      scBind: buildSidechainMesh(R22.scBind, COL.bindC, 0.12, 0.18),
      hotMarkers: (() => {
        const mb = new MeshBuilder();
        mb.addSphere(LM.met108, 0.78, COL.amber);
        mb.addSphere(LM.phe115, 0.78, COL.amber);
        mb.addSphere(LM.leu145, 0.78, COL.amber);
        return mb.upload();
      })(),
      termMarkers: (() => {
        const mb = new MeshBuilder();
        mb.addSphere(LM.nTerm, 0.60, COL.tealHi);
        mb.addSphere(LM.cTerm, 0.60, COL.teal);
        return mb.upload();
      })(),
      unitSphere: (() => {
        const mb = new MeshBuilder();
        mb.addSphere([0, 0, 0], 1.0, [1, 1, 1]);
        return mb.upload();
      })()
    };

    // =========================================================================
    // 3. STRICT-INEQUALITY FILTERS & TRUE LINEAR CSV SCORE AXES
    // =========================================================================
    // Every filter column maps vertical position EXCLUSIVELY to the candidate's
    // actual linear CSV score (bottom = low, top = high, zero Y-jitter).
    // Candidate counts are completely detached and shown in a dedicated lower strip.
    const FILTER_SPECS = [
      {
        key: "plddt",
        step: 1,
        title: "1. pLDDT",
        shortTitle: "pLDDT",
        condText: "> 80",
        condFull: "> 80 점",
        failText: "≤ 80",
        passDir: "up", // strictly > 80 passes UPWARD
        min: 40,
        max: 100,
        thresh: 80.0,
        unit: "점",
        rangeText: "40–100 점",
        dirText: "위쪽 통과 (> 80)",
        ticks: [40, 60, 80, 100],
        minorTicks: [50, 70, 90],
        fmt: (v) => v.toFixed(1),
        fmtExact: (v) => `${v.toFixed(2)} 점`,
        fmtTick: (v, isTop) => isTop ? `${v} 점` : `${v}`,
        passAccent: "#38bdf8",
        passRgb: "56, 189, 248"
      },
      {
        key: "rmsd",
        step: 2,
        title: "2. 접힘 RMSD",
        shortTitle: "접힘 RMSD",
        condText: "< 1 Å",
        condFull: "< 1 Å",
        failText: "≥ 1 Å",
        passDir: "down", // strictly < 1 Å passes DOWNWARD
        min: 0,
        max: 5,
        thresh: 1.0,
        unit: "Å",
        rangeText: "0–5 Å",
        dirText: "아래쪽 통과 (< 1 Å)",
        ticks: [0, 1, 2, 3, 4, 5],
        minorTicks: [0.5, 1.5, 2.5, 3.5, 4.5],
        fmt: (v) => `${v.toFixed(2)} Å`,
        fmtExact: (v) => `${v.toFixed(3)} Å`,
        fmtTick: (v) => `${v} Å`,
        passAccent: "#2dd4bf",
        passRgb: "45, 212, 191"
      },
      {
        key: "pae",
        step: 3,
        title: "3. 계면 PAE",
        shortTitle: "계면 PAE",
        condText: "< 10 Å",
        condFull: "< 10 Å",
        failText: "≥ 10 Å",
        passDir: "down", // strictly < 10 Å passes DOWNWARD
        min: 0,
        max: 30,
        thresh: 10.0,
        unit: "Å",
        rangeText: "0–30 Å",
        dirText: "아래쪽 통과 (< 10 Å)",
        ticks: [0, 10, 20, 30],
        minorTicks: [5, 15, 25],
        fmt: (v) => `${v.toFixed(2)} Å`,
        fmtExact: (v) => `${v.toFixed(2)} Å`,
        fmtTick: (v) => `${v} Å`,
        passAccent: "#34d399",
        passRgb: "52, 211, 153"
      }
    ];

    function applyStrictFilters(list) {
      for (const c of list) {
        c.pass1 = c.plddt > 80.0;
        c.pass2 = c.pass1 && (c.rmsd < 1.0);
        c.pass3 = c.pass2 && (c.pae < 10.0);
        c.drop = !c.pass1 ? 1 : (!c.pass2 ? 2 : (!c.pass3 ? 3 : 0));
        c.pass = c.pass3;
        c.slotX1 = 0.5; c.slotX2 = 0.5; c.slotX3 = 0.5;
        c.restX1 = 0.5; c.restX2 = 0.5; c.restX3 = 0.5;
      }
      // Golden-ratio horizontal dispersion by score rank: keeps close CSV scores separated in X
      // without ever adding a single pixel of vertical jitter to the true score Y!
      const PHI = 0.6180339887498949;
      const assignSlots = (subset, key, prop) => {
        const sorted = subset.slice().sort((a, b) => a[key] - b[key]);
        for (let rank = 0; rank < sorted.length; rank++) {
          sorted[rank][prop] = ((rank + 0.5) * PHI) % 1.0;
        }
      };
      assignSlots(list, "plddt", "slotX1");
      assignSlots(list.filter(c => c.pass1), "rmsd", "slotX2");
      assignSlots(list.filter(c => c.pass2), "pae", "slotX3");
      assignSlots(list.filter(c => c.drop === 1), "plddt", "restX1");
      assignSlots(list.filter(c => c.drop === 2), "rmsd", "restX2");
      assignSlots(list.filter(c => c.drop === 3), "pae", "restX3");
    }

    // Enrich R1 160 candidates & R2 50 candidates with actual amino-acid sequences & deterministic stagger
    const R1 = DATA.r1Cands.map((c, idx) => {
      const near = (c.rmsd < 1.0 && c.tRmsd < 5.0);
      return {
        ...c,
        seq: R1_SEQS[c.id] || "",
        idx, near,
        stagger: vdc(idx, 2),
        stagger2: vdc(idx, 3),
        jitterX: (hash01(idx * 1.37 + 11) - 0.5) * 2,
        jitterY: (hash01(idx * 2.91 + 29) - 0.5) * 2,
        spinSign: hash01(idx * 7.13 + 3) < 0.5 ? -1 : 1,
        restTilt: (hash01(idx * 4.31 + 19) - 0.5) * 0.22,
        ringAng: (c.si / 8) * Math.PI * 2 + (c.bb * 0.35),
        hitX: 0, hitY: 0, hitHW: 0, hitHH: 0, visible: false, isDroppedVis: false, activeCol: -1
      };
    });

    const R2 = DATA.r2Seqs.map((c, idx) => ({
      ...c,
      mutSet: new Set(c.muts || []),
      idx,
      stagger: vdc(idx, 2),
      stagger2: vdc(idx, 3),
      jitterX: (hash01(idx * 3.13 + 71) - 0.5) * 2,
      jitterY: (hash01(idx * 5.41 + 97) - 0.5) * 2,
      spinSign: hash01(idx * 8.29 + 13) < 0.5 ? -1 : 1,
      restTilt: (hash01(idx * 6.17 + 41) - 0.5) * 0.22,
      hitX: 0, hitY: 0, hitHW: 0, hitHH: 0, visible: false, isDroppedVis: false, activeCol: -1
    }));

    applyStrictFilters(R1);
    applyStrictFilters(R2);

    const R2_WINNER = R2.find(c => c.pass);
    const R2_RMSD_EDGE = R2.find(c => c.id === "r14");
    const R1_PLDDT_EDGE = R1.find(c => c.id === "design_02_seq06");
    const R1_BEST_D04 = R1.find(c => c.id === "design_04_seq04");
    const R1_NEAR_EDGE = R1.find(c => c.id === "design_13_seq03");

    function mapScoreToY(val, spec, L) {
      const u = clamp((val - spec.min) / (spec.max - spec.min), 0, 1);
      return lerp(L.bot, L.top, u);
    }

    function getGateLayout(W, H, isR2 = false) {
      const top = clamp(H * 0.195, 118, 152);
      const countBarH = clamp(H * 0.088, 52, 64);
      const transportClear = 68;
      const countBot = H - transportClear;
      const countTop = countBot - countBarH;
      const dividerY = countTop - 6;
      const bot = Math.max(top + 200, dividerY - 14);

      const leftBase = isR2 ? clamp(W * 0.212, 200, 290) : clamp(W * 0.068, 56, 102);
      const rightMargin = clamp(W * 0.018, 14, 28);
      const passGap = clamp(W * 0.014, 12, 22);
      const passBoxW = isR2 ? clamp(W * 0.130, 118, 174) : clamp(W * 0.092, 84, 124);
      const xPassR = W - rightMargin;
      const xPassL = xPassR - passBoxW;
      const xPass = (xPassL + xPassR) * 0.5;

      const colGap = clamp(W * 0.056, 50, 82);
      const totalColsAvail = (xPassL - passGap) - leftBase - colGap * 2;
      const colW = Math.max(115, totalColsAvail / 3);

      const cols = FILTER_SPECS.map((spec, i) => {
        const xL = leftBase + i * (colW + colGap);
        const xR = xL + colW;
        const yThresh = mapScoreToY(spec.thresh, spec, { top, bot });
        return { idx: i, spec, xL, xR, xMid: (xL + xR) * 0.5, w: colW, yThresh };
      });

      return {
        top, bot, h: bot - top,
        dividerY, countTop, countBot, countMidY: (countTop + countBot) * 0.5,
        leftBase, colGap, colW, cols,
        xPassL, xPassR, xPass, passBoxW,
        yPassTop: cols[2].yThresh,
        yPassBot: bot,
        yPassMid: (cols[2].yThresh + bot) * 0.5
      };
    }

    // =========================================================================
    // 4. CAMERA & WEBGL DRAW HELPERS
    // =========================================================================
    const FOV = 35 * Math.PI / 180;
    const Q_ID = [0, 0, 0, 1];
    const ZERO3 = [0, 0, 0];

    const CAM_GALLERY = {
      target: [0, -3.5, 0],
      dist: 326,
      quat: qNorm(qMul(qAxisAngle([0, 1, 0], 0.04), qAxisAngle([1, 0, 0], 0.05)))
    };
    const CAM_D04_FOCUS = {
      target: [-3.0, -1.5, 0.5],
      dist: 82,
      quat: qNorm(qMul(qAxisAngle([0, 1, 0], -0.18), qAxisAngle([1, 0, 0], 0.08)))
    };
    const CAM_REUSE = {
      target: [5.5, -3.5, 0.1], // shifts design_04 cleanly to left-center!
      dist: 76,
      quat: qNorm(qMul(qAxisAngle([0, 1, 0], -0.22), qAxisAngle([1, 0, 0], 0.06)))
    };
    const CAM_R2_ANCHOR = {
      target: [47.5, -2.5, 0.1], // pushes design_04 cleanly into far-left margin clear of Col 1 Y-axis!
      dist: 130,
      quat: qNorm(qMul(qAxisAngle([0, 1, 0], 0.10), qAxisAngle([1, 0, 0], 0.05)))
    };
    const CAM_FINAL = {
      target: [-0.8, -0.6, 0.5],
      dist: 74,
      quat: qNorm(qMul(qAxisAngle([0, 1, 0], -0.14), qAxisAngle([1, 0, 0], 0.08)))
    };

    function makePerspective(fovRad, aspect, near, far) {
      const f = 1 / Math.tan(fovRad * 0.5);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function makeViewAndEye(cam, aspect, wideMode) {
      const refAspect = wideMode ? 1.56 : 1.12;
      const aspectScale = aspect < refAspect ? (refAspect / Math.max(aspect, 0.65)) : 1.0;
      const effDist = cam.dist * aspectScale;
      const r = qRot(cam.quat, [1, 0, 0]);
      const u = qRot(cam.quat, [0, 1, 0]);
      const b = qRot(cam.quat, [0, 0, 1]);
      const t = cam.target;
      const eye = [t[0] + b[0]*effDist, t[1] + b[1]*effDist, t[2] + b[2]*effDist];
      const view = new Float32Array([
        r[0], u[0], b[0], 0,
        r[1], u[1], b[1], 0,
        r[2], u[2], b[2], 0,
        -vDot(r, eye), -vDot(u, eye), -vDot(b, eye), 1
      ]);
      return { view, eye, effDist, right: r, up: u, back: b };
    }

    function mat4Mul(a, b) {
      const out = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          out[c*4 + r] = a[0*4+r]*b[c*4+0] + a[1*4+r]*b[c*4+1] + a[2*4+r]*b[c*4+2] + a[3*4+r]*b[c*4+3];
        }
      }
      return out;
    }

    function projectPoint(vpMat, p, vw, vh) {
      const x = vpMat[0]*p[0] + vpMat[4]*p[1] + vpMat[8]*p[2] + vpMat[12];
      const y = vpMat[1]*p[0] + vpMat[5]*p[1] + vpMat[9]*p[2] + vpMat[13];
      const z = vpMat[2]*p[0] + vpMat[6]*p[1] + vpMat[10]*p[2] + vpMat[14];
      const w = vpMat[3]*p[0] + vpMat[7]*p[1] + vpMat[11]*p[2] + vpMat[15];
      if (w <= 0.1) return null;
      return { sx: (x / w * 0.5 + 0.5) * vw, sy: (1 - (y / w * 0.5 + 0.5)) * vh, ndcZ: z / w };
    }

    function bindMesh(m) {
      gl.bindBuffer(gl.ARRAY_BUFFER, m.vboPos);
      gl.enableVertexAttribArray(LOC.aPos);
      gl.vertexAttribPointer(LOC.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.vboNorm);
      gl.enableVertexAttribArray(LOC.aNorm);
      gl.vertexAttribPointer(LOC.aNorm, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.vboCol);
      gl.enableVertexAttribArray(LOC.aCol);
      gl.vertexAttribPointer(LOC.aCol, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    }

    function setObjUniforms(pos, scale, quat, emissive, tintCol, tintMix) {
      gl.uniform3fv(LOC.uObjPos, pos || ZERO3);
      gl.uniform1f(LOC.uObjScale, scale != null ? scale : 1.0);
      gl.uniform4fv(LOC.uObjQuat, quat || Q_ID);
      gl.uniform1f(LOC.uEmissive, emissive || 0.0);
      gl.uniform3fv(LOC.uTintCol, tintCol || ZERO3);
      gl.uniform1f(LOC.uTintMix, tintMix || 0.0);
    }

    function drawOpaque(m, pos, scale, quat, emissive, tintCol, tintMix) {
      if (!m || !m.count) return;
      gl.disable(gl.BLEND);
      gl.depthMask(true);
      gl.depthFunc(gl.LESS);
      gl.colorMask(true, true, true, true);
      gl.uniform1f(LOC.uAlpha, 1.0);
      setObjUniforms(pos, scale, quat, emissive, tintCol, tintMix);
      bindMesh(m);
      gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
    }

    function drawTranslucent(m, alpha, pos, scale, quat, emissive, tintCol, tintMix) {
      if (!m || !m.count || alpha <= 0.01) return;
      setObjUniforms(pos, scale, quat, emissive, tintCol, tintMix);
      bindMesh(m);
      gl.disable(gl.BLEND);
      gl.colorMask(false, false, false, false);
      gl.depthMask(true);
      gl.depthFunc(gl.LESS);
      gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
      gl.colorMask(true, true, true, true);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.depthFunc(gl.LEQUAL);
      gl.uniform1f(LOC.uAlpha, alpha);
      gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
      gl.depthMask(true);
      gl.depthFunc(gl.LESS);
      gl.disable(gl.BLEND);
    }

    function drawAuto(m, alpha, pos, scale, quat, emissive, tintCol, tintMix) {
      if (alpha <= 0.01) return;
      if (alpha >= 0.98) drawOpaque(m, pos, scale, quat, emissive, tintCol, tintMix);
      else drawTranslucent(m, alpha, pos, scale, quat, emissive, tintCol, tintMix);
    }

    // =========================================================================
    // 5. PLAYBACK & INTERACTION STATE
    // =========================================================================
    const params = new URLSearchParams(window.location.search);
    const initT = params.has("t") ? clamp(parseFloat(params.get("t")) || 0, 0, T_TOTAL) : 0.0;
    const initPaused = params.get("paused") === "1";

    const state = {
      t: initT,
      playing: !initPaused,
      stopAt: null, // when stepping manually with Next/Prev, stop gracefully at beat end
      showDesignOverlay: false,
      userOrbitQuat: null,
      userZoomFactor: 1.0,
      orbitClock: 0,
      lastVpMat: null,
      hoverCand: null,
      cssW: 1280,
      cssH: 720,
      dpr: 1
    };

    function currentBeatIndex(t) {
      for (let i = BEATS.length - 1; i >= 0; i--) {
        if (t >= BEATS[i].start - 1e-4) return i;
      }
      return 0;
    }

    function resetUserCam() {
      state.userOrbitQuat = null;
      state.userZoomFactor = 1.0;
    }

    // =========================================================================
    // 6. DETERMINISTIC SCORE-PURE SEQUENCE FLOW PHYSICS
    // =========================================================================
    // Inside each filter column, vertical height is STRICTLY the candidate's
    // exact CSV score (zero vertical jitter, horizontal-only recoil on fail).
    function evalGateParticle(c, t, cfg, L) {
      const { tG1_0, tG1_1, tG2_0, tG2_1, tG3_0, tG3_1, halfW = 24 } = cfg;
      const col1 = L.cols[0], col2 = L.cols[1], col3 = L.cols[2];

      const y1 = mapScoreToY(c.plddt, col1.spec, L);
      const y2 = mapScoreToY(c.rmsd,  col2.spec, L);
      const y3 = mapScoreToY(c.pae,   col3.spec, L);

      const padL = Math.min(halfW + 10, col1.w * 0.25);
      const padR = Math.min(halfW + 12, col1.w * 0.26);

      const xStart1 = lerp(col1.xL + padL, col1.xL + col1.w * 0.62, c.slotX1);
      const xRest1  = lerp(col1.xL + padL, col1.xR - padR, c.restX1);

      const xHold2  = lerp(col2.xL + padL, col2.xL + col2.w * 0.62, c.slotX2);
      const xRest2  = lerp(col2.xL + padL, col2.xR - padR, c.restX2);

      const xHold3  = lerp(col3.xL + padL, col3.xL + col3.w * 0.62, c.slotX3);
      const xRest3  = lerp(col3.xL + padL, col3.xR - padR, c.restX3);

      const xPassFinal = L.xPass;
      // Winner rests right inside the < 10 Å lower pass zone at its exact score y3 (or gently clear of top border)
      const yPassFinal = clamp(y3, L.yPassTop + 22, L.yPassBot - 44);

      const st1 = c.stagger * 0.60;
      const tHit1 = lerp(tG1_0 + 0.45, tG1_1 - 0.45, st1);
      const tDep1 = tHit1 - 0.65;
      const tArrive2 = tHit1 + 0.56;

      const st2 = c.stagger2 * 0.60;
      const tHit2 = lerp(tG2_0 + 0.48, tG2_1 - 0.45, st2);
      const tDep2 = tHit2 - 0.62;
      const tArrive3 = tHit2 + 0.56;

      const st3 = c.pass ? 0.74 : c.stagger * 0.60;
      const tHit3 = lerp(tG3_0 + 0.52, tG3_1 - 0.62, st3);
      const tDep3 = tHit3 - 0.65;
      const tArrivePass = tHit3 + 0.60;

      const g1HitX = c.drop === 1 ? (col1.xR - halfW - 3) : col1.xR;
      const g2HitX = c.drop === 2 ? (col2.xR - halfW - 3) : col2.xR;
      const g3HitX = c.drop === 3 ? (col3.xR - halfW - 3) : col3.xR;

      function horizontalRecoil(hitX, restX, exactY, age) {
        const dur = 0.58;
        const p = clamp(age / dur, 0, 1);
        const bx = lerp(hitX, restX, easeOutCubic(p));
        return { x: bx, y: exactY, settled: p >= 1 };
      }

      let x = xStart1, y = y1, rot = 0;
      let activeCol = 0;
      let status = "alive"; // alive | bouncing | dropped | passed
      let impactAge = -1, impactX = 0, impactY = 0;
      let gateCrossFlash = 0, gateCrossX = 0, gateCrossY = 0;

      if (t < tDep1) {
        x = xStart1; y = y1; activeCol = 0;
      } else if (t < tHit1) {
        const u = easeInOutCubic(invLerp(tDep1, tHit1, t));
        x = lerp(xStart1, g1HitX, u);
        y = y1; activeCol = 0;
      } else if (c.drop === 1) {
        const age = t - tHit1;
        const b = horizontalRecoil(g1HitX, xRest1, y1, age);
        x = b.x; y = b.y; activeCol = 0;
        status = b.settled ? "dropped" : "bouncing";
        impactAge = age; impactX = col1.xR; impactY = y1;
      } else if (t < tDep2) {
        const u = easeInOutCubic(invLerp(tHit1, tArrive2, t));
        x = lerp(col1.xR, xHold2, u);
        y = lerp(y1, y2, smoothstep(0.08, 0.72, u));
        activeCol = u > 0.45 ? 1 : 0;
        gateCrossFlash = Math.max(0, 1 - (t - tHit1) / 0.36);
        gateCrossX = col1.xR; gateCrossY = y1;
      } else if (t < tHit2) {
        const u = easeInOutCubic(invLerp(tDep2, tHit2, t));
        x = lerp(xHold2, g2HitX, u);
        y = y2; activeCol = 1;
      } else if (c.drop === 2) {
        const age = t - tHit2;
        const b = horizontalRecoil(g2HitX, xRest2, y2, age);
        x = b.x; y = b.y; activeCol = 1;
        status = b.settled ? "dropped" : "bouncing";
        impactAge = age; impactX = col2.xR; impactY = y2;
      } else if (t < tDep3) {
        const u = easeInOutCubic(invLerp(tHit2, tArrive3, t));
        x = lerp(col2.xR, xHold3, u);
        y = lerp(y2, y3, smoothstep(0.08, 0.72, u));
        activeCol = u > 0.45 ? 2 : 1;
        gateCrossFlash = Math.max(0, 1 - (t - tHit2) / 0.36);
        gateCrossX = col2.xR; gateCrossY = y2;
      } else if (t < tHit3) {
        const u = easeInOutCubic(invLerp(tDep3, tHit3, t));
        x = lerp(xHold3, g3HitX, u);
        y = y3; activeCol = 2;
      } else if (c.drop === 3) {
        const age = t - tHit3;
        const b = horizontalRecoil(g3HitX, xRest3, y3, age);
        x = b.x; y = b.y; activeCol = 2;
        status = b.settled ? "dropped" : "bouncing";
        impactAge = age; impactX = col3.xR; impactY = y3;
      } else {
        const u = easeOutCubic(invLerp(tHit3, tArrivePass, t));
        x = lerp(col3.xR, xPassFinal, u);
        y = lerp(y3, yPassFinal, u);
        activeCol = 3;
        status = "passed";
        gateCrossFlash = Math.max(0, 1 - (t - tHit3) / 0.95);
        gateCrossX = col3.xR; gateCrossY = y3;
      }

      return {
        x, y, rot, status, activeCol,
        impactAge, impactX, impactY,
        gateCrossFlash, gateCrossX, gateCrossY,
        tHit1, tHit2, tHit3, y1, y2, y3, yPassFinal
      };
    }

    // =========================================================================
    // 7. 2D MANIM DRAWING PRIMITIVES
    // =========================================================================
    function drawSubtleGrid(W, H, alpha) {
      if (alpha <= 0.005) return;
      fx.save();
      fx.strokeStyle = `rgba(148, 163, 184, ${(0.032 * alpha).toFixed(4)})`;
      fx.lineWidth = 1;
      const step = Math.max(48, Math.round(W / 24));
      fx.beginPath();
      for (let x = step; x < W; x += step) {
        fx.moveTo(x + 0.5, 0); fx.lineTo(x + 0.5, H);
      }
      for (let y = step; y < H; y += step) {
        fx.moveTo(0, y + 0.5); fx.lineTo(W, y + 0.5);
      }
      fx.stroke();
      fx.restore();
    }

    function drawSegmentedText(x, y, segs, font, align = "left") {
      fx.save();
      fx.font = font;
      fx.textAlign = "left";
      fx.textBaseline = "top";
      let totalW = 0;
      const widths = segs.map(s => {
        const w = fx.measureText(s.text).width;
        totalW += w;
        return w;
      });
      let curX = align === "right" ? (x - totalW) : (align === "center" ? (x - totalW * 0.5) : x);
      for (let i = 0; i < segs.length; i++) {
        fx.fillStyle = segs[i].color;
        fx.fillText(segs[i].text, curX, y);
        curX += widths[i];
      }
      fx.restore();
      return totalW;
    }

    function drawScoreRuler(col, valText, y, xTo, colorHex, alpha) {
      if (alpha <= 0.02) return;
      fx.save();
      fx.globalAlpha = alpha;

      // Dashed horizontal ruler from Y-axis to the sequence's exact score position
      fx.strokeStyle = colorHex;
      fx.lineWidth = 1.25;
      fx.setLineDash([3, 3]);
      fx.beginPath();
      fx.moveTo(col.xL, y);
      fx.lineTo(xTo, y);
      fx.stroke();
      fx.setLineDash([]);

      // Exact score anchor dot on the Y-axis
      fx.fillStyle = colorHex;
      fx.beginPath();
      fx.arc(col.xL, y, 3.2, 0, Math.PI * 2);
      fx.fill();

      // Avoid overlapping the highlighted threshold tick pill on the Y-axis while keeping
      // the dashed ruler & axis dot strictly locked to exact score y!
      let pillY = y;
      if (Math.abs(y - col.yThresh) < 17) {
        pillY = (y >= col.yThresh) ? (col.yThresh + 17) : (col.yThresh - 17);
      }

      // Score pill badge right on the left of the Y-axis
      fx.font = `800 9.5px ${MONO_FONT_FAM}`;
      const tw = fx.measureText(valText).width;
      const bw = tw + 9, bh = 15;
      const bx = col.xL - bw - 7;
      const by = pillY - bh * 0.5;

      // Tiny diagonal leader from exact axis dot (col.xL, y) to pill if nudged
      if (Math.abs(pillY - y) > 1) {
        fx.strokeStyle = colorHex;
        fx.lineWidth = 1.1;
        fx.beginPath();
        fx.moveTo(col.xL, y);
        fx.lineTo(bx + bw, pillY);
        fx.stroke();
      }

      roundRectPath(bx, by, bw, bh, 4);
      fx.fillStyle = "rgba(7, 11, 18, 0.96)";
      fx.fill();
      fx.strokeStyle = colorHex;
      fx.lineWidth = 1.15;
      fx.stroke();
      fx.textAlign = "center";
      fx.textBaseline = "middle";
      fx.fillStyle = colorHex;
      fx.fillText(valText, bx + bw * 0.5, pillY + 0.5);
      fx.restore();
    }

    function drawFilterColumn(col, L, drawProg, opts = {}) {
      if (drawProg <= 0.01) return;
      const { pulse = 0, isPassedAll = false, isActive = false } = opts;
      const { spec, xL, xR, xMid, w, yThresh } = col;
      const p = easeOutCubic(clamp(drawProg, 0, 1));
      const curTop = lerp(yThresh, L.top, p);
      const curBot = lerp(yThresh, L.bot, p);

      const isUp = spec.passDir === "up";
      const yPass0 = isUp ? curTop : yThresh;
      const yPass1 = isUp ? yThresh : curBot;
      const yFail0 = isUp ? yThresh : curTop;
      const yFail1 = isUp ? curBot : yThresh;

      fx.save();
      fx.globalAlpha = p;

      // 1. Subtle Pass & Fail Region Washes (immediately clarifies UP vs DOWN pass direction!)
      const passGrad = fx.createLinearGradient(0, isUp ? curTop : curBot, 0, yThresh);
      passGrad.addColorStop(0, `rgba(${spec.passRgb}, ${(isActive ? 0.13 : 0.09).toFixed(3)})`);
      passGrad.addColorStop(1, `rgba(${spec.passRgb}, ${(isActive ? 0.05 : 0.032).toFixed(3)})`);
      fx.fillStyle = passGrad;
      fx.fillRect(xL, yPass0, w, Math.max(0, yPass1 - yPass0));

      const failGrad = fx.createLinearGradient(0, isUp ? curBot : curTop, 0, yThresh);
      failGrad.addColorStop(0, "rgba(251, 113, 133, 0.055)");
      failGrad.addColorStop(1, "rgba(251, 113, 133, 0.025)");
      fx.fillStyle = failGrad;
      fx.fillRect(xL, yFail0, w, Math.max(0, yFail1 - yFail0));

      // Subtle frame top/bottom guides
      fx.strokeStyle = "rgba(148, 163, 184, 0.12)";
      fx.lineWidth = 1;
      fx.beginPath();
      fx.moveTo(xL, curTop + 0.5); fx.lineTo(xR, curTop + 0.5);
      fx.moveTo(xL, curBot + 0.5); fx.lineTo(xR, curBot + 0.5);
      fx.stroke();

      // 2. Real Numerical Y-Axis Spine + Minor & Major Ticks + Horizontal Gridlines
      fx.strokeStyle = "rgba(148, 163, 184, 0.44)";
      fx.lineWidth = 1.25;
      fx.beginPath();
      fx.moveTo(xL + 0.5, curTop);
      fx.lineTo(xL + 0.5, curBot);
      fx.stroke();

      // Minor ticks
      fx.strokeStyle = "rgba(148, 163, 184, 0.25)";
      fx.lineWidth = 1;
      fx.beginPath();
      for (const mv of spec.minorTicks) {
        const my = mapScoreToY(mv, spec, L);
        if (my >= curTop && my <= curBot) {
          fx.moveTo(xL - 3, my + 0.5);
          fx.lineTo(xL, my + 0.5);
        }
      }
      fx.stroke();

      // Major ticks, gridlines & numerical labels
      fx.font = `600 9.5px ${MONO_FONT_FAM}`;
      fx.textAlign = "right";
      fx.textBaseline = "middle";
      for (let ti = 0; ti < spec.ticks.length; ti++) {
        const tv = spec.ticks[ti];
        const ty = mapScoreToY(tv, spec, L);
        if (ty < curTop - 1 || ty > curBot + 1) continue;
        const isThreshTick = Math.abs(tv - spec.thresh) < 1e-6;
        const isTopTick = (ti === spec.ticks.length - 1);

        // Tick mark
        fx.strokeStyle = isThreshTick ? "rgba(248, 250, 252, 0.85)" : "rgba(148, 163, 184, 0.50)";
        fx.lineWidth = isThreshTick ? 1.5 : 1;
        fx.beginPath();
        fx.moveTo(xL - 6, ty + 0.5);
        fx.lineTo(xL, ty + 0.5);
        fx.stroke();

        // Subtle horizontal gridline across column
        if (!isThreshTick) {
          fx.strokeStyle = "rgba(148, 163, 184, 0.085)";
          fx.lineWidth = 1;
          fx.beginPath();
          fx.moveTo(xL + 1, ty + 0.5);
          fx.lineTo(xR - 1, ty + 0.5);
          fx.stroke();
        }

        // Tick value label
        const lbl = spec.fmtTick(tv, isTopTick);
        if (isThreshTick) {
          // Highlighted threshold tick badge on Y-axis
          fx.font = `800 9.5px ${MONO_FONT_FAM}`;
          const tw = fx.measureText(lbl).width;
          const bw = tw + 8, bh = 15;
          roundRectPath(xL - bw - 7, ty - bh * 0.5, bw, bh, 4);
          fx.fillStyle = "rgba(15, 23, 42, 0.94)";
          fx.fill();
          fx.strokeStyle = spec.passAccent;
          fx.lineWidth = 1.1;
          fx.stroke();
          fx.textAlign = "center";
          fx.fillStyle = "#f8fafc";
          fx.fillText(lbl, xL - 7 - bw * 0.5, ty + 0.5);
          fx.textAlign = "right";
          fx.font = `600 9.5px ${MONO_FONT_FAM}`;
        } else {
          fx.fillStyle = "rgba(148, 163, 184, 0.84)";
          fx.fillText(lbl, xL - 8, ty + 0.5);
        }
      }

      // 3. Horizontal Threshold Boundary Line (Strict Inequality Cue!)
      fx.save();
      fx.strokeStyle = `rgba(248, 250, 252, ${0.72 + pulse * 0.22})`;
      fx.lineWidth = 1.5;
      fx.setLineDash([5, 4]);
      fx.beginPath();
      fx.moveTo(xL + 4, yThresh + 0.5);
      fx.lineTo(xR, yThresh + 0.5);
      fx.stroke();
      fx.setLineDash([]);

      // Hollow open circle on Y-axis at threshold: strict inequality (< or >, boundary value excluded!)
      fx.fillStyle = "#070b12";
      fx.strokeStyle = "#f8fafc";
      fx.lineWidth = 1.6;
      fx.beginPath();
      fx.arc(xL + 0.5, yThresh + 0.5, 3.2, 0, Math.PI * 2);
      fx.fill();
      fx.stroke();

      // Clear Pass / Fail Region Direction Labels inside column near boundary
      fx.textAlign = "left";
      fx.font = "700 10px 'Pretendard Variable', Pretendard, sans-serif";
      const passLbl = `${isUp ? "▲" : "▼"} 통과 (${spec.condText})`;
      const failLbl = `${isUp ? "▼" : "▲"} 탈락 (${spec.failText})`;
      if (isUp) {
        fx.textBaseline = "bottom";
        fx.fillStyle = spec.passAccent;
        fx.fillText(passLbl, xL + 8, yThresh - 5);
        fx.textBaseline = "top";
        fx.fillStyle = "rgba(251, 113, 133, 0.82)";
        fx.fillText(failLbl, xL + 8, yThresh + 6);
      } else {
        fx.textBaseline = "bottom";
        fx.fillStyle = "rgba(251, 113, 133, 0.82)";
        fx.fillText(failLbl, xL + 8, yThresh - 5);
        fx.textBaseline = "top";
        fx.fillStyle = spec.passAccent;
        fx.fillText(passLbl, xL + 8, yThresh + 6);
      }
      fx.restore();

      // 4. Right-Edge Physical Light Gate (Open Aperture on Pass Side, Rose Barrier on Fail Side!)
      // 4a. Open Pass Aperture
      fx.save();
      fx.strokeStyle = isPassedAll
        ? `rgba(52, 211, 153, ${0.58 + 0.28 * pulse})`
        : `rgba(${spec.passRgb}, ${0.38 + 0.30 * pulse})`;
      fx.lineWidth = 1.6;
      fx.setLineDash([5, 5]);
      fx.beginPath();
      fx.moveTo(xR, yPass0 + (isUp ? 2 : 4));
      fx.lineTo(xR, yPass1 - (isUp ? 4 : 2));
      fx.stroke();
      fx.setLineDash([]);

      // Aperture end brackets
      fx.strokeStyle = isPassedAll ? "rgba(52, 211, 153, 0.88)" : `rgba(${spec.passRgb}, 0.72)`;
      fx.lineWidth = 2;
      fx.beginPath();
      fx.moveTo(xR - 5, yPass0 + 1); fx.lineTo(xR + 5, yPass0 + 1);
      fx.moveTo(xR - 5, yPass1 - 1); fx.lineTo(xR + 5, yPass1 - 1);
      fx.stroke();
      fx.restore();

      // 4b. Solid Rose Laser Barrier on Fail Side
      fx.save();
      const wallH = Math.max(0, yFail1 - yFail0);
      const glowW = 14 + pulse * 10;
      const bloomGrad = fx.createLinearGradient(xR - glowW, 0, xR + 5, 0);
      bloomGrad.addColorStop(0, "rgba(251, 113, 133, 0)");
      bloomGrad.addColorStop(0.76, `rgba(251, 113, 133, ${0.14 + pulse * 0.16})`);
      bloomGrad.addColorStop(1, "rgba(251, 113, 133, 0)");
      fx.fillStyle = bloomGrad;
      fx.fillRect(xR - glowW, yFail0, glowW + 5, wallH);

      const wallGrad = fx.createLinearGradient(xR, yThresh, xR, isUp ? curBot : curTop);
      wallGrad.addColorStop(0, "rgba(251, 113, 133, 0.96)");
      wallGrad.addColorStop(0.78, "rgba(251, 113, 133, 0.76)");
      wallGrad.addColorStop(1, "rgba(251, 113, 133, 0.34)");
      fx.strokeStyle = wallGrad;
      fx.lineWidth = 2.6;
      fx.beginPath();
      fx.moveTo(xR, yFail0 + (isUp ? 2 : 0));
      fx.lineTo(xR, yFail1 - (isUp ? 0 : 2));
      fx.stroke();
      fx.restore();

      // 5. Column Header ABOVE Axis (STRICTLY metric, strict threshold, range & unit — ZERO counts!)
      if (drawProg > 0.30) {
        const ha = smoothstep(0.30, 0.82, drawProg);
        fx.save();
        fx.globalAlpha = ha;
        const headY = L.top - 36;
        drawSegmentedText(xMid, headY, [
          { text: spec.title + " ", color: "#f1f5f9" },
          { text: spec.condFull, color: spec.passAccent }
        ], "800 13px 'Pretendard Variable', Pretendard, sans-serif", "center");

        fx.textAlign = "center";
        fx.textBaseline = "top";
        fx.font = "600 10.5px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "rgba(148, 163, 184, 0.84)";
        fx.fillText(`세로축 ${spec.rangeText} · ${spec.dirText}`, xMid, L.top - 18);
        fx.restore();
      }

      fx.restore();
    }

    // Dedicated Detached Lower Count Strip (Candidate Counts 100% separated from score axes!)
    function drawFilterCountStrip(L, drawProg, cfg) {
      if (drawProg <= 0.05) return;
      const {
        totalN, isR2,
        g1Started, g1Pass, g1Drop,
        g2Started, g2Pass, g2Drop,
        g3Started, g3Pass, g3Drop,
        allDone
      } = cfg;
      const a = smoothstep(0.05, 0.70, drawProg);
      const col1 = L.cols[0], col2 = L.cols[1], col3 = L.cols[2];

      fx.save();
      fx.globalAlpha = a;

      // Crisp horizontal divider separating the Score Axes (top) from Candidate Counts (bottom)
      const stripLeft = isR2 ? Math.max(18, L.leftBase - 98) : 18;
      const stripRight = L.xPassR;
      fx.strokeStyle = "rgba(148, 163, 184, 0.20)";
      fx.lineWidth = 1;
      fx.beginPath();
      fx.moveTo(stripLeft, L.dividerY + 0.5);
      fx.lineTo(stripRight, L.dividerY + 0.5);
      fx.stroke();

      // Subtle glass strip backing
      roundRectPath(stripLeft, L.countTop, stripRight - stripLeft, L.countBot - L.countTop, 10);
      fx.fillStyle = "rgba(9, 15, 27, 0.58)";
      fx.fill();
      fx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      fx.lineWidth = 1;
      fx.stroke();

      const yNum = L.countTop + 10;
      const ySub = L.countTop + 36;

      // Start candidate count block (far left of strip)
      const startX = isR2 ? (L.leftBase - 46) : Math.max(54, L.leftBase * 0.58);
      fx.textAlign = "center";
      fx.textBaseline = "top";
      fx.font = "700 9.5px 'Pretendard Variable', Pretendard, sans-serif";
      fx.fillStyle = "rgba(148, 163, 184, 0.78)";
      fx.fillText("후보 수", startX, L.countTop + 6);
      fx.font = "800 20px 'Pretendard Variable', Pretendard, sans-serif";
      fx.fillStyle = isR2 ? "#6ee7b7" : "#7dd3fc";
      fx.fillText(String(totalN), startX, L.countTop + 21);

      // Arrow from Start -> Filter 1
      const drawArrow = (ax, ay, active) => {
        fx.save();
        fx.textAlign = "center";
        fx.textBaseline = "middle";
        fx.font = "700 15px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = active ? "rgba(203, 213, 225, 0.78)" : "rgba(100, 116, 139, 0.36)";
        fx.fillText("→", ax, ay);
        fx.restore();
      };

      const arrow0X = lerp(startX + 24, col1.xMid - 54, 0.5);
      drawArrow(arrow0X, L.countMidY, true);

      // Helper for each filter stage's Pass / Fail counts
      const drawStageCount = (cx, started, passVal, dropVal, passCol, zeroFailHighlight = false, zeroPassDanger = false) => {
        fx.save();
        fx.textAlign = "center";
        fx.textBaseline = "top";

        if (!started) {
          fx.font = "700 13px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(100, 116, 139, 0.45)";
          fx.fillText("—", cx, yNum + 5);
          fx.font = "600 10px 'Pretendard Variable', Pretendard, sans-serif";
          fx.fillStyle = "rgba(100, 116, 139, 0.40)";
          fx.fillText("대기", cx, ySub);
        } else {
          const pCol = zeroPassDanger ? "#fb7185" : passCol;
          drawSegmentedText(cx, yNum, [
            { text: "통과 ", color: "rgba(148, 163, 184, 0.82)" },
            { text: String(passVal), color: pCol }
          ], "800 19px 'Pretendard Variable', Pretendard, sans-serif", "center");

          const dCol = (dropVal === 0 && zeroFailHighlight) ? "#34d399" : (dropVal > 0 ? "#fb7185" : "rgba(148, 163, 184, 0.65)");
          drawSegmentedText(cx, ySub, [
            { text: "탈락 ", color: "rgba(148, 163, 184, 0.72)" },
            { text: String(dropVal), color: dCol }
          ], "700 11.5px 'Pretendard Variable', Pretendard, sans-serif", "center");
        }
        fx.restore();
      };

      // Stage 1: pLDDT > 80
      drawStageCount(col1.xMid, g1Started, g1Pass, g1Drop, isR2 ? "#34d399" : "#38bdf8", isR2 && g1Pass >= totalN, false);
      drawArrow((col1.xR + col2.xL) * 0.5, L.countMidY, g2Started);

      // Stage 2: RMSD < 1 Å
      drawStageCount(col2.xMid, g2Started, g2Pass, g2Drop, "#2dd4bf", false, false);
      drawArrow((col2.xR + col3.xL) * 0.5, L.countMidY, g3Started);

      // Stage 3: PAE < 10 Å
      const r1AllFailed = !isR2 && allDone && g3Pass === 0;
      drawStageCount(col3.xMid, g3Started, g3Pass, g3Drop, "#34d399", false, r1AllFailed);

      // Right-end Final Result Badge aligned under Pass Zone
      drawArrow((col3.xR + L.xPassL) * 0.5, L.countMidY, g3Started);
      fx.save();
      fx.textAlign = "center";
      fx.textBaseline = "top";
      if (!g3Started) {
        fx.font = "700 11px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "rgba(100, 116, 139, 0.45)";
        fx.fillText("최종", L.xPass, L.countTop + 10);
        fx.font = "800 16px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillText("—", L.xPass, L.countTop + 26);
      } else if (g3Pass > 0) {
        fx.font = "700 10px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "#34d399";
        fx.fillText("최종 통과", L.xPass, L.countTop + 8);
        fx.font = "800 20px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "#34d399";
        fx.fillText(`${g3Pass}개`, L.xPass, L.countTop + 23);
      } else {
        fx.font = "700 10px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = allDone ? "#fb7185" : "rgba(148, 163, 184, 0.72)";
        fx.fillText("최종 통과", L.xPass, L.countTop + 8);
        fx.font = "800 20px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = allDone ? "#fb7185" : "rgba(148, 163, 184, 0.55)";
        fx.fillText("0개", L.xPass, L.countTop + 23);
      }
      fx.restore();

      fx.restore();
    }

    const MONO_FONT_FAM = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    const monoWidthCache = new Map();

    function getMonoCharW(fontSize, weight = 700) {
      const key = weight + "_" + fontSize.toFixed(1);
      if (monoWidthCache.has(key)) return monoWidthCache.get(key);
      fx.font = `${weight} ${fontSize.toFixed(1)}px ${MONO_FONT_FAM}`;
      const w = fx.measureText("M").width;
      monoWidthCache.set(key, w);
      return w;
    }

    function roundRectPath(x, y, w, h, r) {
      const rr = Math.min(r, w * 0.5, h * 0.5);
      fx.beginPath();
      fx.moveTo(x + rr, y);
      fx.lineTo(x + w - rr, y);
      fx.quadraticCurveTo(x + w, y, x + w, y + rr);
      fx.lineTo(x + w, y + h - rr);
      fx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      fx.lineTo(x + rr, y + h);
      fx.quadraticCurveTo(x, y + h, x, y + h - rr);
      fx.lineTo(x, y + rr);
      fx.quadraticCurveTo(x, y, x + rr, y);
      fx.closePath();
    }

    function getGalleryCellSize(W, H) {
      const dx = (bbScreen[1] && bbScreen[0]) ? Math.abs(bbScreen[1].sx - bbScreen[0].sx) : W / 5.4;
      const dy = (bbScreen[5] && bbScreen[0]) ? Math.abs(bbScreen[5].sy - bbScreen[0].sy) : H / 4.4;
      return { cellW: clamp(dx, 92, W * 0.24), cellH: clamp(dy, 74, H * 0.25) };
    }

    function getBackboneSeqOffset(si, cellW, cellH, zoomExtra = 0, W = 1280, H = 720) {
      // Gallery (zoomExtra=0): tidy 4-left + 4-right curved arc around each 3D backbone.
      // Zoomed hero (zoomExtra=1): all 8 sequences fan into a clean vertical column on the LEFT
      // of design_04 so TrkA & its hotspot labels on the right remain 100% unobstructed!
      const side = si < 4 ? -1 : 1;
      const row = si % 4;
      const rowFrac = (row - 1.5) / 1.5; // -1, -0.333, +0.333, +1
      const bow = (row === 1 || row === 2) ? 1.09 : 0.96;
      const baseX = side * cellW * 0.305 * bow;
      const baseY = cellH * 0.305 * rowFrac;

      const zoomFrac = (si - 3.5) / 3.5; // -1 .. +1 across all 8 rows
      const zoomX = -Math.min(W * 0.245, 255);
      const zoomY = Math.min(H * 0.30, 196) * zoomFrac;
      return {
        dx: lerp(baseX, zoomX, zoomExtra),
        dy: lerp(baseY, zoomY, zoomExtra),
        side: zoomExtra > 0.5 ? -1 : side
      };
    }

    function getR2MatrixLayout(W, H) {
      const x0 = clamp(Math.max(W * 0.455, W * 0.25 + Math.min(W, H) * 0.22 + 22), W * 0.43, W * 0.54);
      const x1 = W - Math.max(22, W * 0.024);
      const y0 = Math.max(122, H * 0.205);
      const y1 = Math.min(H - 110, H * 0.795);
      const cols = 5, rows = 10;
      const colW = (x1 - x0) / cols;
      const rowH = (y1 - y0) / rows;
      return { x0, x1, y0, y1, cols, rows, colW, rowH };
    }

    // Core visual primitive: renders each candidate's ACTUAL amino-acid sequence string!
    function drawSeqToken(x, y, seq, opts = {}) {
      const {
        chars = 9,
        ellipsis = true,
        fontSize = 9.0,
        weight = 700,
        color = "#7dd3fc",
        alpha = 0.95,
        bgAlpha = 0.68,
        borderColor = null,
        borderWidth = 0.85,
        rot = 0,
        scale = 1.0,
        glowColor = null,
        glowBlur = 0,
        mutSet = null,
        mutColor = "#fef08a",
        strikeProg = 0,
        prevX = null,
        prevY = null,
        trailColor = null,
        isHovered = false,
        lines = 1
      } = opts;

      if (alpha <= 0.015 || !seq || scale <= 0.05) return { hw: 0, hh: 0 };

      const fsz = fontSize * scale;
      const charW = getMonoCharW(fsz, weight);
      const nChars = Math.max(3, Math.min(seq.length, Math.round(chars)));
      let lineArr;
      let lineOffsets;
      if (lines === 2 && nChars >= 10) {
        const half = Math.ceil(nChars / 2);
        const l1 = seq.slice(0, half);
        const hasMore = (nChars < seq.length && ellipsis);
        const l2 = seq.slice(half, nChars) + (hasMore ? "…" : "");
        lineArr = [l1, l2];
        lineOffsets = [0, half];
      } else {
        const hasMore = (nChars < seq.length && ellipsis);
        lineArr = [seq.slice(0, nChars) + (hasMore ? "…" : "")];
        lineOffsets = [0];
      }

      const maxLen = Math.max(...lineArr.map(s => s.length));
      const padX = bgAlpha > 0.01 ? Math.max(3.2, fsz * 0.44) : 1.5;
      const padY = bgAlpha > 0.01 ? Math.max(2.0, fsz * 0.25) : 1.0;
      const lineH = fsz * 1.24;
      const textW = maxLen * charW;
      const boxW = textW + padX * 2;
      const boxH = lineArr.length * lineH + padY * 2;
      const hw = boxW * 0.5;
      const hh = boxH * 0.5;

      fx.save();
      fx.globalAlpha = alpha;

      // Delicate kinetic slipstream behind fast-moving sequences (zero round orbs!)
      if (prevX !== null && prevY !== null) {
        const dx = x - prevX, dy = y - prevY;
        const d = Math.hypot(dx, dy);
        if (d > 2.2 && d < 220) {
          const grad = fx.createLinearGradient(prevX, prevY, x, y);
          grad.addColorStop(0, "rgba(0,0,0,0)");
          grad.addColorStop(1, trailColor || color);
          fx.save();
          fx.globalAlpha = alpha * 0.34;
          fx.strokeStyle = grad;
          fx.lineWidth = Math.max(1.2, fsz * 0.22);
          fx.lineCap = "round";
          fx.beginPath();
          fx.moveTo(prevX, prevY);
          fx.lineTo(x, y);
          fx.stroke();
          fx.restore();
        }
      }

      fx.translate(x, y);
      if (Math.abs(rot) > 0.002) fx.rotate(rot);

      if (glowColor && glowBlur > 0) {
        fx.shadowColor = glowColor;
        fx.shadowBlur = glowBlur;
      }

      // Subtle translucent dark glass capsule for active/readable sequences
      if (bgAlpha > 0.01 || isHovered) {
        roundRectPath(-hw, -hh, boxW, boxH, Math.min(4.5, hh * 0.7));
        if (bgAlpha > 0.01) {
          fx.fillStyle = `rgba(7, 11, 18, ${(isHovered ? Math.max(bgAlpha, 0.90) : bgAlpha).toFixed(3)})`;
          fx.fill();
        }
        if (borderColor || isHovered) {
          fx.strokeStyle = isHovered ? "#ffffff" : borderColor;
          fx.lineWidth = isHovered ? 1.4 : borderWidth;
          fx.stroke();
        }
      }

      // Render actual amino-acid letters
      fx.font = `${weight} ${fsz.toFixed(1)}px ${MONO_FONT_FAM}`;
      fx.textAlign = "left";
      fx.textBaseline = "middle";
      fx.fillStyle = color;

      for (let li = 0; li < lineArr.length; li++) {
        const str = lineArr[li];
        const startIdx = lineOffsets[li];
        const lx = -str.length * charW * 0.5;
        const ly = -((lineArr.length - 1) * 0.5 - li) * lineH + 0.4;
        fx.fillText(str, lx, ly);

        // Highlight mutated amino-acid residues directly inside the sequence string (Round 2!)
        if (mutSet && mutSet.size > 0 && alpha > 0.35) {
          fx.save();
          fx.shadowBlur = 0;
          fx.fillStyle = mutColor;
          const drawLen = str.endsWith("…") ? str.length - 1 : str.length;
          for (let ci = 0; ci < drawLen; ci++) {
            if (mutSet.has(startIdx + ci)) {
              fx.fillText(str[ci], lx + ci * charW, ly);
            }
          }
          fx.restore();
        }
      }

      // Crisp animated strikethrough when discarding old Round-1 sequences in Beat 3A
      if (strikeProg > 0.02) {
        const sp = clamp(strikeProg, 0, 1);
        fx.save();
        fx.shadowBlur = 0;
        fx.strokeStyle = "rgba(251, 113, 133, 0.92)";
        fx.lineWidth = 1.3;
        fx.beginPath();
        fx.moveTo(-hw + 2, 0);
        fx.lineTo(lerp(-hw + 2, hw - 2, sp), 0);
        fx.stroke();
        fx.restore();
      }

      fx.restore();
      return { hw, hh };
    }

    function drawRipple(x, y, age, maxDur, maxR, rgbStr) {
      if (age < 0 || age > maxDur) return;
      const u = age / maxDur;
      const r = lerp(3, maxR, easeOutCubic(u));
      const a = Math.pow(1 - u, 1.8) * 0.85;
      fx.save();
      fx.strokeStyle = `rgba(${rgbStr}, ${a.toFixed(3)})`;
      fx.lineWidth = lerp(2.4, 0.6, u);
      fx.beginPath();
      fx.arc(x, y, r, 0, Math.PI * 2);
      fx.stroke();
      fx.restore();
    }

    function drawCallout(x, y, text, sub, colorHex, alpha, align = "left", withBg = false) {
      if (alpha <= 0.02) return;
      fx.save();
      fx.globalAlpha = alpha;
      const dir = align === "right" ? -1 : 1;
      const lx = x + dir * 14;
      const ly = y - 16;

      // Hairline leader
      fx.strokeStyle = colorHex;
      fx.globalAlpha = alpha * 0.62;
      fx.lineWidth = 1.2;
      fx.beginPath();
      fx.moveTo(x + dir * 3, y - 2);
      fx.lineTo(lx, ly);
      fx.stroke();

      fx.globalAlpha = alpha;
      fx.font = "800 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      const w1 = fx.measureText(text).width;
      fx.font = "600 10px 'Pretendard Variable', Pretendard, sans-serif";
      const w2 = sub ? fx.measureText(sub).width : 0;
      const maxW = Math.max(w1, w2);

      if (withBg) {
        const padX = 7, padY = 4;
        const boxW = maxW + padX * 2;
        const boxH = sub ? 30 : 18;
        const tx = lx + dir * 4;
        const bx = align === "right" ? (tx - maxW - padX) : (tx - padX);
        const by = ly - 13 - padY * 0.5;
        roundRectPath(bx, by, boxW, boxH, 5);
        fx.fillStyle = "rgba(7, 11, 18, 0.88)";
        fx.fill();
        fx.strokeStyle = colorHex;
        fx.globalAlpha = alpha * 0.42;
        fx.lineWidth = 1;
        fx.stroke();
        fx.globalAlpha = alpha;
      }

      fx.textAlign = align;
      fx.textBaseline = "bottom";
      fx.shadowColor = "rgba(7, 11, 18, 0.95)";
      fx.shadowBlur = 10;
      fx.font = "800 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      fx.fillStyle = colorHex;
      fx.fillText(text, lx + dir * 4, ly + 1);

      if (sub) {
        fx.textBaseline = "top";
        fx.font = "600 10px 'Pretendard Variable', Pretendard, sans-serif";
        fx.fillStyle = "rgba(226, 232, 240, 0.94)";
        fx.fillText(sub, lx + dir * 4, ly + 3);
      }
      fx.restore();
    }

    // =========================================================================
    // 8. MASTER CONTINUOUS FRAME RENDERER (3D WebGL + 2D Manim FX)
    // =========================================================================
    function resizeCanvases() {
      const rect = glCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = Math.max(300, Math.round(rect.width));
      const cssH = Math.max(240, Math.round(rect.height));
      const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
      state.cssW = cssW; state.cssH = cssH; state.dpr = dpr;
      if (glCanvas.width !== bw || glCanvas.height !== bh) {
        glCanvas.width = bw; glCanvas.height = bh;
      }
      if (fxCanvas.width !== bw || fxCanvas.height !== bh) {
